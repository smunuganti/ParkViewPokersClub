<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    
    <!-- Deployment Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rummy Scorer">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#022c22">
    
    <!-- FIFA World Cup Icons -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23022c22%22/><text y=%22.9em%22 font-size=%2280%22 x=%2210%22>🏆</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">

    <title>Rummy Scorer - World Cup 2026 Edition</title>
    
    <!-- Core Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Screenshot Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* WORLD CUP STADIUM ANIMATIONS */
        @keyframes item-fall {
            0% { transform: translateY(-20vh) rotate(0deg); opacity: 0; }
            15% { opacity: var(--item-opacity); }
            85% { opacity: var(--item-opacity); }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        @keyframes spotlight-pan {
            0% { transform: rotate(-35deg) translateX(-20vw); }
            50% { transform: rotate(35deg) translateX(20vw); }
            100% { transform: rotate(-35deg) translateX(-20vw); }
        }
        @keyframes camera-flash {
            0%, 93%, 100% { opacity: 0; }
            94% { opacity: 0.6; }
            95% { opacity: 0.1; }
            96% { opacity: 0.55; }
            97% { opacity: 0.05; }
        }
        @keyframes trophy-pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(234, 179, 8, 0.4)); }
            50% { transform: scale(1.06); filter: drop-shadow(0 0 35px rgba(234, 179, 8, 0.7)); }
        }
        @keyframes stadium-aura {
            0% { opacity: 0.15; transform: scale(1); filter: blur(55px); }
            50% { opacity: 0.35; transform: scale(1.2); filter: blur(75px); }
            100% { opacity: 0.15; transform: scale(1); filter: blur(55px); }
        }
        @keyframes bg-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animate-fall { 
            animation: item-fall linear infinite; 
            will-change: transform;
        }
        .animate-trophy { 
            animation: trophy-pulse 4s ease-in-out infinite; 
            will-change: transform;
        }
        .animate-flash { 
            animation: camera-flash 10s infinite; 
            will-change: opacity;
        }
        .animate-stadium-lights { 
            animation: stadium-aura 8s ease-in-out infinite; 
            will-change: transform, opacity;
        }
        
        .stadium-bg-dark {
            background: linear-gradient(-45deg, #022c22, #044e3a, #064e3b, #111827, #022c22);
            background-size: 400% 400%;
            animation: bg-shift 15s ease infinite;
            will-change: background-position;
        }

        .stadium-bg-light {
            background: linear-gradient(-45deg, #f0fdf4, #dcfce7, #fef08a, #f0fdf4);
            background-size: 400% 400%;
            animation: bg-shift 15s ease infinite;
            will-change: background-position;
        }

        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body {
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            user-select: none;
            height: 100vh;
            width: 100vw;
            background-color: #022c22;
            transition: background-color 0.5s ease;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-active:active { transform: scale(0.96); }
        input { user-select: text; }
        
        .pt-safe { padding-top: env(safe-area-inset-top); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

        .volt-text { color: #a3e635; text-shadow: 0 0 10px rgba(163, 230, 53, 0.4); }
        .stadium-glow { text-shadow: 0 0 20px rgba(234, 179, 8, 0.5); }

        /* Grey State Implementation */
        .player-inactive {
            filter: grayscale(1) !important;
            opacity: 0.25 !important;
            pointer-events: none;
        }
        .total-inactive {
            text-decoration: line-through;
            opacity: 0.4;
        }
    </style>
</head>
<body id="app-body">
    <div id="root"></div>

    <script>
        // Configure Babel standalone to compile JSX cleanly to React.createElement
        Babel.registerPreset('classic-react', {
            presets: [
                [Babel.availablePresets['react'], { runtime: 'classic' }]
            ]
        });
    </script>

    <script type="text/babel" data-presets="classic-react">
        const { useState, useEffect, useRef, useMemo } = React;

        const Icon = React.memo(({ name, size = 20, className = "" }) => {
            const icons = {
                "soccer-ball": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <circle cx="12" cy="12" r="10" />
                        <path d="m12 2-1.5 5h3L12 2Z" />
                        <path d="M12 22l-1.5-5h3L12 22Z" />
                        <path d="m2 12 5-1.5v3L2 12Z" />
                        <path d="m22 12-5-1.5v3l5 1.5Z" />
                        <path d="m12 7-4.5 3 1.5 4.5h6l1.5-4.5L12 7Z" />
                    </svg>
                ),
                "trophy": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
                        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
                        <path d="M4 22h16" />
                        <path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34" />
                        <path d="M12 2a6 6 0 0 1 6 6v3.5c0 3.3-2.7 6-6 6s-6-2.7-6-6V8a6 6 0 0 1 6-6Z" />
                    </svg>
                ),
                "plus": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                ),
                "pencil-line": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                        <path d="m15 5 3 3"/>
                    </svg>
                ),
                "camera": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
                        <circle cx="12" cy="13" r="3"/>
                    </svg>
                ),
                "rotate-ccw": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                ),
                "history": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                        <circle cx="12" cy="12" r="1"/>
                        <polyline points="12 7 12 12 15 15"/>
                    </svg>
                ),
                "settings-2": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M20 7h-9"/>
                        <path d="M14 17H5"/>
                        <circle cx="17" cy="17" r="3"/>
                        <circle cx="7" cy="7" r="3"/>
                    </svg>
                ),
                "users": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                ),
                "lock": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                ),
                "x": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                ),
                "user-minus": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <line x1="22" y1="11" x2="16" y2="11"/>
                    </svg>
                ),
                "sun": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                    </svg>
                ),
                "moon": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                    </svg>
                ),
                "alert-triangle": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                ),
                "check-circle-2": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                        <path d="m9 12 2 2 4-4"/>
                    </svg>
                ),
                "pencil": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                    </svg>
                ),
                "loader-2": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={`animate-spin ${className}`}>
                        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                    </svg>
                )
            };
            return icons[name] || (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <circle cx="12" cy="12" r="10"/>
                </svg>
            );
        });

        const STORAGE_KEY = "rummy_scorer_prod_v201_fifa_final";
        const THEME_KEY = "rummy_scorer_theme_pref_fifa";
        const DEFAULT_ROSTER = ['Player 1', 'Player 2', 'Player 3'];

        // --- Stadium Ambient Visuals ---

        const StadiumStarsAndBalls = React.memo(() => {
            const elements = useMemo(() => {
                return Array.from({ length: 45 }).map((_, i) => ({
                    id: i,
                    left: Math.random() * 100,
                    opacity: 0.15 + Math.random() * 0.45,
                    duration: 5 + Math.random() * 6,
                    delay: Math.random() * 5,
                    size: 14 + Math.random() * 14,
                    type: i % 2 === 0 ? "soccer-ball" : "trophy"
                }));
            }, []);

            return (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-10 opacity-30">
                    {elements.map(item => (
                        <div key={item.id} className="absolute animate-fall" style={{ 
                            left: `${item.left}%`, 
                            top: '-50px',
                            color: item.type === "trophy" ? "#fbbf24" : "#ffffff",
                            '--item-opacity': item.opacity,
                            animationDuration: `${item.duration}s`, 
                            animationDelay: `${item.delay}s` 
                        }}>
                            <Icon name={item.type} size={item.size} />
                        </div>
                    ))}
                    <div className="absolute inset-0 bg-white/70 animate-flash pointer-events-none"></div>
                </div>
            );
        });

        const StadiumSpotlights = React.memo(() => {
            return (
                <div className="absolute inset-0 pointer-events-none overflow-hidden z-[5] opacity-20">
                    <div 
                        className="absolute top-0 left-[20%] w-[350px] h-[150vh] origin-top bg-gradient-to-b from-cyan-400/40 via-blue-500/10 to-transparent"
                        style={{
                            transform: "rotate(-25deg)",
                            animation: "spotlight-pan 12s ease-in-out infinite"
                        }}
                    ></div>
                    <div 
                        className="absolute top-0 right-[20%] w-[350px] h-[150vh] origin-top bg-gradient-to-b from-amber-400/30 via-yellow-500/5 to-transparent"
                        style={{
                            transform: "rotate(25deg)",
                            animation: "spotlight-pan 12s ease-in-out infinite",
                            animationDelay: "-6s"
                        }}
                    ></div>
                </div>
            );
        });

        const FIFACenterpiece = React.memo(() => (
            <div className="relative w-48 h-64 flex items-center justify-center">
                <div className="absolute w-80 h-80 bg-emerald-600/30 rounded-full blur-[100px] animate-stadium-lights"></div>
                <div className="absolute w-60 h-60 bg-amber-500/20 rounded-full blur-[60px] animate-stadium-lights delay-1000"></div>
                <div className="relative z-10 animate-trophy flex flex-col items-center">
                    <div className="text-yellow-400 drop-shadow-[0_0_25px_rgba(234,179,8,0.7)]">
                        <Icon name="trophy" size={130} />
                    </div>
                </div>
            </div>
        ));

        const CountdownTimer = React.memo(({ isDarkMode }) => {
            const [timeLeft, setTimeLeft] = useState({ d: 0, h: 0, m: 0, s: 0, finished: false });

            useEffect(() => {
                const targetDate = new Date("2026-07-19T18:00:00").getTime();
                const timer = setInterval(() => {
                    const now = new Date().getTime();
                    const diff = targetDate - now;
                    if (diff <= 0) {
                        setTimeLeft({ d: 0, h: 0, m: 0, s: 0, finished: true });
                        clearInterval(timer);
                    } else {
                        setTimeLeft({
                            d: Math.floor(diff / (1000 * 60 * 60 * 24)),
                            h: Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                            m: Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)),
                            s: Math.floor((diff % (1000 * 60)) / 1000),
                            finished: false
                        });
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="flex flex-col items-center mb-6 relative z-20">
                    <div className="text-[10px] font-black uppercase tracking-[0.5em] mb-3 opacity-80 volt-text">2026 World Cup Final Countdown</div>
                    <div className="flex gap-4">
                        {[
                            { label: 'Days', value: timeLeft.d },
                            { label: 'Hrs', value: timeLeft.h },
                            { label: 'Min', value: timeLeft.m },
                            { label: 'Sec', value: timeLeft.s }
                        ].map((unit, i) => (
                            <div key={i} className="flex flex-col items-center">
                                <div className={`text-3xl font-black tabular-nums tracking-tighter ${isDarkMode ? 'text-white' : 'text-emerald-950'}`}>
                                    {String(unit.value).padStart(2, '0')}
                                </div>
                                <div className="text-[8px] font-bold uppercase tracking-widest opacity-40">{unit.label}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        });

        // --- Core Application ---

        const App = () => {
            const [showWelcome, setShowWelcome] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const saved = localStorage.getItem(THEME_KEY);
                return saved === null ? true : saved === 'true';
            });

            const [game, setGame] = useState(() => {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) return JSON.parse(data);
                return { players: DEFAULT_ROSTER, rounds: [], history: [], inactive: [], reEntries: new Array(DEFAULT_ROSTER.length).fill(0) };
            });

            const [ui, setUi] = useState({ add: false, editIdx: null, settings: false, history: false, bust: null, confirm: null, isSharing: false });
            const [form, setForm] = useState({ scores: {}, name: '', editIdx: null, editVal: '', error: null });
            const scrollRef = useRef(null);

            const players = game.players;
            const rounds = game.rounds;
            const sessionHistory = game.history || [];
            const inactive = game.inactive || [];
            const reEntries = game.reEntries || new Array(players.length).fill(0);

            const totals = useMemo(() => players.map((_, pIdx) => rounds.reduce((sum, r) => sum + (Array.isArray(r) ? (r[pIdx] || 0) : 0), 0)), [players, rounds]);
            const activeTotals = useMemo(() => totals.filter((_, i) => !inactive.includes(i)), [totals, inactive]);
            const leaderIdx = useMemo(() => rounds.length === 0 ? -1 : totals.findIndex((t, i) => !inactive.includes(i) && t === Math.min(...activeTotals)), [totals, inactive, activeTotals, rounds]);
            const matchOver = (players.length - inactive.length) <= 1 && rounds.length > 0;

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(game));
                localStorage.setItem(THEME_KEY, isDarkMode.toString());
                if (!showWelcome) document.body.style.backgroundColor = isDarkMode ? "#022c22" : "#f0fdf4";
            }, [game, isDarkMode, showWelcome]);

            useEffect(() => {
                if (!showWelcome && scrollRef.current && game.rounds.length > 0) {
                    scrollRef.current.scrollTo({ top: scrollRef.current.scrollHeight, behavior: 'smooth' });
                }
            }, [game.rounds, showWelcome]);

            const isPlayerLocked = (pIdx) => {
                if (!ui.bust) return false;
                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                );
                if (safeOpponents.length === 0) return false; 
                return !safeOpponents.some(t => t < 180);
            };

            const submitScores = (isEditing = false) => {
                setForm(f => ({ ...f, error: null }));
                const entry = players.map((p, i) => inactive.includes(i) ? 0 : parseInt(form.scores[p] || 0));
                
                if (entry.filter((s, i) => !inactive.includes(i) && s === 0).length !== 1) {
                    setForm(f => ({ ...f, error: "One winner (score 0) is required." })); return;
                }

                if (isEditing) {
                    const up = [...rounds]; up[ui.editIdx] = entry;
                    setGame(g => ({ ...g, rounds: up }));
                    setUi(u => ({ ...u, editIdx: null })); setForm(f => ({ ...f, scores: {} }));
                } else {
                    const proj = totals.map((t, i) => t + (entry[i] || 0));
                    const bustedIdxs = proj.map((t, i) => (!inactive.includes(i) && t > 200) ? i : -1).filter(i => i !== -1);
                    
                    if (bustedIdxs.length > 0) {
                        const safePlayers = proj.filter((t, i) => !bustedIdxs.includes(i) && !inactive.includes(i));
                        const target = (safePlayers.length > 0 ? Math.max(...safePlayers) : 0) + 1;
                        setUi(u => ({ ...u, bust: { idxs: bustedIdxs, current: bustedIdxs[0], target, pending: entry, proj } }));
                    } else {
                        setGame(g => ({ ...g, rounds: [...g.rounds, entry] }));
                        setUi(u => ({ ...u, add: false })); setForm(f => ({ ...f, scores: {} }));
                    }
                }
            };

            const solveBust = (rejoin) => {
                const scores = [...ui.bust.pending];
                const pIdx = ui.bust.current;
                const locked = isPlayerLocked(pIdx);
                let upIn = [...inactive]; let upRe = [...reEntries];

                if (rejoin && !locked) {
                    scores[pIdx] = ui.bust.target - totals[pIdx];
                    upRe[pIdx] = (upRe[pIdx] || 0) + 1;
                } else {
                    if (!upIn.includes(pIdx)) upIn.push(pIdx);
                }

                const remaining = ui.bust.idxs.filter(i => i !== pIdx);
                if (remaining.length === 0) {
                    setGame(g => ({ ...g, inactive: upIn, reEntries: upRe, rounds: [...g.rounds, scores] }));
                    setUi(u => ({ ...u, bust: null, add: false })); setForm(f => ({ ...f, scores: {} }));
                } else {
                    setGame(g => ({ ...g, inactive: upIn, reEntries: upRe }));
                    setUi(u => ({ ...u, bust: { ...u.bust, current: remaining[0], idxs: remaining, pending: scores } }));
                }
            };

            const midGameJoin = () => {
                if(!form.name.trim()) return;
                const activeHigh = activeTotals.length > 0 ? Math.max(...activeTotals) : Math.max(...totals);
                const joinScore = activeHigh + 1;
                setGame(g => ({
                    ...g, players: [...g.players, form.name.trim()], 
                    reEntries: [...(g.reEntries || new Array(g.players.length).fill(0)), 0],
                    rounds: g.rounds.map((r, i) => i === 0 ? [...r, joinScore] : [...r, 0])
                }));
                setForm(f => ({ ...f, name: '' }));
            };

            const savePlayerNameEdit = (idx) => {
                if (!form.editVal.trim()) return;
                const up = [...players]; up[idx] = form.editVal.trim();
                setGame(prev => ({ ...prev, players: up }));
                setForm(f => ({ ...f, editIdx: null, editVal: '' }));
            };

            const startNewMatch = () => {
                if (rounds.length === 0) return;
                setUi(u => ({ ...u, confirm: { msg: "End the tournament and head to the locker room?", fn: () => {
                    const summary = { id: Date.now(), ts: Date.now(), players: [...players], rounds: [...rounds], inactive: [...inactive], reEntries: [...reEntries], finalScores: [...totals] };
                    setGame(prev => ({ ...prev, rounds: [], inactive: [], reEntries: new Array(prev.players.length).fill(0), history: [summary, ...(prev.history || [])].slice(0, 10) }));
                    setUi(prevUi => ({ ...prevUi, confirm: null }));
                }}}));
            };

            const restoreSession = (log) => {
                setUi({ ...ui, confirm: { msg: "Restore session? Current match data will be overwritten.", fn: () => {
                    setGame(prev => ({ 
                        ...prev, 
                        players: log.players, 
                        rounds: log.rounds, 
                        inactive: log.inactive || [], 
                        reEntries: log.reEntries || new Array(log.players.length).fill(0) 
                    }));
                    setUi(u => ({ ...u, history: false, confirm: null }));
                }}});
            };

            const shareAsScreenshot = async () => {
                const element = document.getElementById('scoreboard-capture');
                if (!element || !window.html2canvas) return;
                setUi(prev => ({ ...prev, isSharing: true }));
                try {
                    const canvas = await html2canvas(element, {
                        backgroundColor: isDarkMode ? "#022c22" : "#f0fdf4",
                        scale: 2, logging: false, useCORS: true
                    });
                    canvas.toBlob(async (blob) => {
                        if (!blob) return;
                        const file = new File([blob], "world-cup-rummy.png", { type: "image/png" });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try { await navigator.share({ files: [file], title: 'World Cup Rummy', text: 'Cup Standings' }); } catch (e) {
                                const link = document.createElement('a'); link.download = 'standings.png'; link.href = URL.createObjectURL(blob); link.click();
                            }
                        } else {
                            const link = document.createElement('a'); link.download = 'standings.png'; link.href = URL.createObjectURL(blob); link.click();
                        }
                        setUi(prev => ({ ...prev, isSharing: false }));
                    }, "image/png");
                } catch (error) {
                    setUi(prev => ({ ...prev, isSharing: false }));
                }
            };

            return (
                <div className={`fixed inset-0 flex flex-col transition-colors duration-500 overflow-hidden ${isDarkMode ? 'bg-[#022c22]' : 'bg-[#f0fdf4]'}`}>
                    <StadiumStarsAndBalls />
                    <StadiumSpotlights />
                    
                    <nav className={`flex-none px-4 py-4 z-40 pt-safe border-b backdrop-blur-xl ${isDarkMode ? 'bg-emerald-950/80 border-white/5 text-slate-100' : 'bg-white/90 border-emerald-100 text-emerald-950 shadow-sm'}`}>
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-2 group">
                                <button onClick={() => setShowWelcome(true)} className="w-10 h-10 rounded-2xl flex items-center justify-center text-white shadow-lg bg-yellow-500 active:scale-90 transition-all"><Icon name="trophy" /></button>
                                <div className="text-left leading-none">
                                    <h1 className="text-[11px] font-black uppercase tracking-tight text-yellow-400">Rummy Scorer</h1>
                                    <span className="text-[9px] font-bold uppercase opacity-80 italic leading-none">World Cup 2026</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-1">
                                <button onClick={startNewMatch} className="p-2 opacity-70 hover:opacity-100 text-yellow-500 active:scale-90 transition-all"><Icon name="rotate-ccw" /></button>
                                <button onClick={() => setUi({...ui, history: true})} className="p-2 opacity-70 active:scale-90 transition-all"><Icon name="history" /></button>
                                <button onClick={() => setUi({...ui, settings: true})} className="p-2 opacity-70 active:scale-90 transition-all"><Icon name="settings-2" /></button>
                            </div>
                        </div>
                    </nav>

                    {showWelcome ? (
                        <div className={`fixed inset-0 flex flex-col items-center justify-center p-8 z-50 ${isDarkMode ? 'bg-[#022c22]' : 'bg-[#f0fdf4]'}`}>
                            <CountdownTimer isDarkMode={isDarkMode} />
                            <FIFACenterpiece />
                            <div className="text-center mt-8">
                                <h1 className="text-4xl font-black uppercase italic text-yellow-400 tracking-tighter">Match Kick-off</h1>
                                <p className="text-xs font-black uppercase opacity-60 mt-2 mb-10 tracking-[0.2em]">World Cup 2026 Finals Tournament</p>
                                <button onClick={() => setShowWelcome(false)} className="px-12 py-5 bg-yellow-500 text-black rounded-3xl font-black uppercase shadow-2xl tracking-widest active:scale-95 transition-all">Start Match</button>
                            </div>
                        </div>
                    ) : (
                        <div id="scoreboard-capture" className="flex-1 flex flex-col overflow-hidden relative">
                            <div className={`flex-none flex border-b-2 z-20 ${isDarkMode ? 'bg-emerald-950/70 border-white/5 shadow-lg text-slate-100' : 'bg-white shadow-sm text-emerald-950'}`}>
                                <div className="w-10 flex items-center justify-center text-[8px] font-black text-emerald-500/80 italic uppercase leading-none">Match</div>
                                <div className="flex-1 flex">
                                    {players.map((p, i) => (
                                        <div key={i} className={`flex-1 border-r last:border-r-0 py-3 text-center truncate transition-all duration-500 ${inactive.includes(i) ? 'player-inactive bg-black/15' : ''}`}>
                                            <div className="flex flex-col items-center justify-center px-0.5 min-w-0">
                                                <span className={`text-[10px] font-black uppercase truncate block w-full tracking-tight ${isDarkMode ? 'text-yellow-400' : 'text-emerald-800'}`}>{p}</span>
                                                {reEntries[i] > 0 && <span className="bg-amber-500 text-black text-[6px] px-1 rounded-sm leading-none py-1 font-black">R{reEntries[i]}</span>}
                                                {inactive.includes(i) && <span className="text-[6px] text-red-500 font-bold uppercase mt-1 italic leading-none">RED CARD</span>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div ref={scrollRef} className="flex-1 overflow-y-auto no-scrollbar bg-black/5">
                                {rounds.map((round, rIdx) => (
                                    <div key={rIdx} className={`flex border-b transition-colors ${isDarkMode ? 'border-white/5 hover:bg-white/5 text-slate-100' : 'border-emerald-100 hover:bg-white text-emerald-950'}`}>
                                        <div className="w-10 flex flex-col items-center justify-center py-4"><span className="text-[10px] font-bold text-slate-500 italic">{rIdx + 1}</span><button onClick={() => { setUi({...ui, editIdx: rIdx}); const c = {}; players.forEach((p, i) => c[p] = round[i]); setForm({...form, scores: c}); }} className="text-yellow-500/40 mt-1 active:scale-90 transition-all"><Icon name="pencil-line" size={12} /></button></div>
                                        <div className="flex-1 flex">
                                            {round.map((score, cIdx) => (
                                                <div key={cIdx} className={`flex-1 border-r last:border-r-0 flex items-center justify-center py-4 transition-all duration-500 ${inactive.includes(cIdx) ? 'opacity-20 grayscale' : ''}`}>
                                                    {score === 0 ? <span className="w-7 h-7 rounded-full bg-yellow-500 text-black flex items-center justify-center text-[10px] font-black shadow-md border border-white/20">0</span> : <span className={`text-sm font-bold tabular-nums ${isDarkMode ? 'text-slate-200' : 'text-slate-700'}`}>{score}</span>}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className={`flex-none flex text-white shadow-[0_-10px_30px_rgba(0,0,0,0.3)] z-30 transition-colors ${isDarkMode ? 'bg-emerald-900 border-t border-white/5' : 'bg-emerald-700 shadow-xl'}`}>
                                <div className="w-10 flex items-center justify-center text-[8px] font-black italic bg-black/20 text-yellow-300 uppercase leading-tight">Total</div>
                                <div className="flex-1 flex">
                                    {totals.map((total, i) => (
                                        <div key={i} className={`flex-1 py-4 border-r last:border-r-0 border-white/5 text-center font-black text-lg min-w-0 transition-all duration-500 ${inactive.includes(i) ? 'total-inactive grayscale' : ''}`}>
                                            <span className="flex items-center justify-center gap-1">{total} {i === leaderIdx && !inactive.includes(i) && rounds.length > 0 && <Icon name="soccer-ball" size={16} className="text-yellow-400 animate-bounce" />}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    <div className={`p-5 pb-safe flex-none border-t z-20 ${isDarkMode ? 'bg-emerald-950/90 border-white/5' : 'bg-white border-emerald-100 shadow-xl'}`}>
                        {matchOver ? (
                            <div className="text-center p-2 animate-in zoom-in-95 duration-500"><h4 className="text-xl font-black italic text-yellow-400 uppercase mb-3 text-center">🏆 Champions League Winner!</h4><button onClick={startNewMatch} className="px-10 py-4 bg-yellow-500 text-black rounded-full text-xs font-black uppercase active:scale-95 transition-all shadow-xl">New Cup</button></div>
                        ) : (
                            <div className="flex gap-2 max-w-lg mx-auto">
                                <button onClick={() => setUi({...ui, add: true})} className="flex-1 h-16 bg-yellow-500 hover:bg-yellow-400 text-black rounded-3xl font-black uppercase tracking-widest shadow-xl flex items-center justify-center gap-3 active:scale-95 transition-all"><Icon name="plus" size={24} /> Record Score</button>
                                <button onClick={shareAsScreenshot} disabled={ui.isSharing} className={`px-6 h-16 rounded-2xl font-black shadow-xl flex items-center justify-center transition-all active:scale-95 ${isDarkMode ? 'bg-emerald-900 text-yellow-400' : 'bg-emerald-50 text-emerald-800'} ${ui.isSharing ? 'animate-pulse' : ''}`}>
                                    {ui.isSharing ? <Icon name="loader-2" size={24} /> : <Icon name="camera" size={24} />}
                                </button>
                            </div>
                        )}
                    </div>

                    {/* MODAL SYSTEM */}
                    {(ui.add || ui.editIdx !== null || ui.settings || ui.history || ui.bust || ui.confirm) && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm animate-in fade-in">
                            
                            {(ui.add || ui.editIdx !== null) && (
                                <div className={`w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl border animate-in slide-in-from-bottom-10 ${isDarkMode ? 'bg-emerald-900 border-white/5 text-white' : 'bg-white border-emerald-100 text-slate-900'}`}>
                                    <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-black text-yellow-400 uppercase italic">{ui.editIdx !== null ? "Edit Hand" : "Add Hand"}</h3><button onClick={() => setUi({...ui, add: false, editIdx: null})} className="text-slate-500 p-2"><Icon name="x" size={28} /></button></div>
                                    {form.error && <div className="mb-4 bg-red-500/10 p-3 rounded-xl text-[10px] font-black text-red-500 uppercase animate-bounce">{form.error}</div>}
                                    <div className="grid grid-cols-2 gap-4 mb-8 max-h-[40vh] overflow-y-auto pr-1 no-scrollbar">{players.map((p, idx) => !inactive.includes(idx) && (<div key={idx} className="flex flex-col gap-2"><label className="text-[10px] font-black uppercase text-yellow-400 truncate">{p}</label><input type="number" inputMode="numeric" value={form.scores[p] || ''} onChange={e => setForm({...form, scores: {...form.scores, [p]: e.target.value}})} className={`w-full p-5 rounded-2xl text-center text-3xl font-black outline-none border transition-all ${isDarkMode ? 'bg-emerald-950 border-white/5 text-yellow-300' : 'bg-emerald-50 border-emerald-100 text-emerald-950'}`} placeholder="0" /></div>))}</div>
                                    <button onClick={() => submitScores(ui.editIdx !== null)} className="w-full bg-yellow-500 hover:bg-yellow-400 text-black py-6 rounded-3xl font-black uppercase shadow-xl tracking-widest active:scale-95 transition-all">Confirm Hand</button>
                                </div>
                            )}

                            {ui.settings && (
                                <div className={`w-full max-sm rounded-[2.5rem] p-8 shadow-2xl border ${isDarkMode ? 'bg-emerald-900 border-white/5 text-white' : 'bg-white border-emerald-100 text-slate-900'}`}>
                                    <h3 className="text-xl font-black text-yellow-400 uppercase mb-8 flex items-center gap-3 tracking-tighter"><Icon name="users" /> Tournament Registry</h3>
                                    <input type="text" value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Player Name" className={`w-full p-5 rounded-2xl mb-4 font-bold outline-none border ${isDarkMode ? 'bg-emerald-950 border-white/5 text-yellow-300' : 'bg-emerald-50 border-emerald-100'}`} />
                                    <div className="grid grid-cols-2 gap-2 mb-8">
                                        <button onClick={() => { if(form.name) { setGame(g=>({...g, players: [...g.players, form.name.trim()], rounds: [], inactive: [], reEntries: new Array(g.players.length+1).fill(0)})); setForm(f=>({...f, name:''})); setUi(u=>({...u, settings: false})); }}} className={`py-4 rounded-2xl text-[10px] font-black uppercase border active:scale-95 transition-all border-white/10 bg-slate-800`}>Reset Pitch</button>
                                        <button onClick={midGameJoin} className="py-4 bg-yellow-500 text-black rounded-2xl text-[10px] font-black uppercase shadow-lg active:scale-95 transition-all">Join @ Max+1</button>
                                    </div>
                                    <div className="space-y-2 mb-8 max-h-48 overflow-y-auto pr-1 no-scrollbar">
                                        {players.map((p, i) => (
                                            <div key={i} className={`flex items-center justify-between p-3 border rounded-2xl transition-all ${isDarkMode ? 'bg-emerald-950 border-white/5' : 'bg-emerald-50 border-emerald-100 shadow-sm'} ${inactive.includes(i) ? 'opacity-30 grayscale' : ''}`}>
                                                {form.editIdx === i ? (
                                                    <div className="flex-1 flex gap-2 min-w-0">
                                                        <input type="text" value={form.editVal} onChange={e => setForm({...form, editVal: e.target.value})} className="flex-1 bg-black/40 px-3 py-1 rounded text-[10px] font-black uppercase outline-none text-yellow-300 min-w-0" autoFocus />
                                                        <button onClick={() => savePlayerNameEdit(i)} className="text-emerald-500 shrink-0"><Icon name="check-circle-2" /></button>
                                                    </div>
                                                ) : (
                                                    <>
                                                        <span className="text-[10px] font-black uppercase truncate max-w-[120px]">{p} {inactive.includes(i) && <span className="ml-1 text-[8px]">(OUT)</span>}</span>
                                                        <div className="flex gap-1 shrink-0">
                                                            <button onClick={() => setForm({...form, editIdx: i, editVal: p})} className="p-2 opacity-50 text-emerald-500"><Icon name="pencil" size={16}/></button>
                                                            {players.length > 2 && <button onClick={() => setUi({ ...ui, confirm: { msg: `Remove player ${p}? Tournament will reset.`, fn: () => { setGame({...game, players: players.filter((_, idx) => idx !== i), rounds: [], inactive: []}); setUi({...ui, confirm: null}); } } })} className="text-red-500 p-2"><Icon name="user-minus" size={18}/></button>}
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => setUi({...ui, settings: false})} className="w-full py-5 bg-emerald-950 text-white rounded-2xl font-black uppercase text-xs active:scale-95 transition-all border border-white/5 text-center">Close Registry</button>
                                </div>
                            )}

                            {ui.history && (
                                <div className={`w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl border ${isDarkMode ? 'bg-emerald-950 border-white/5 text-white' : 'bg-white border-emerald-100 text-slate-900'}`}>
                                    <h3 className="text-xl font-black text-yellow-400 uppercase mb-6 flex items-center gap-3 tracking-tighter"><Icon name="history" /> History Log</h3>
                                    <div className="space-y-4 max-h-[50vh] overflow-y-auto pr-1 no-scrollbar">
                                        {sessionHistory.length === 0 ? <div className="py-20 text-center opacity-20 text-xs font-black uppercase italic tracking-widest text-center font-bold">Empty Archives</div> : sessionHistory.map((log) => (
                                            <div key={log.id} className={`p-4 rounded-2xl border ${isDarkMode ? 'bg-black/40 border-white/5 shadow-inner' : 'bg-emerald-50 border-emerald-100 shadow-sm'}`}>
                                                <div className="flex justify-between mb-3 border-b border-white/5 pb-2 text-yellow-400 font-black tracking-widest">
                                                    <span className="text-[10px]">{new Date(log.id).toLocaleDateString()}</span>
                                                    <button onClick={() => restoreSession(log)} className="text-[8px] bg-yellow-500 text-black px-2 py-1 rounded font-black uppercase active:scale-90 transition-all">Restore</button>
                                                </div>
                                                <div className="grid grid-cols-2 gap-2">
                                                    {log.players.map((pName, pIdx) => (
                                                        <div key={pIdx} className="flex items-center justify-between text-[10px] opacity-80 truncate">
                                                            <span className="truncate">{pName}</span>
                                                            <span className="font-bold">{log.finalScores[pIdx]}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => setUi({...ui, history: false})} className="w-full mt-8 py-5 bg-emerald-950 text-white rounded-2xl font-black uppercase text-xs active:scale-95 transition-all border border-white/5 text-center">Close</button>
                                </div>
                            )}

                            {ui.confirm && (
                                <div className="w-full max-w-xs rounded-[2.5rem] p-8 bg-emerald-950 border border-white/10 text-center shadow-2xl animate-in zoom-in-95">
                                    <Icon name="alert-triangle" size={32} className="text-yellow-400 mb-4 mx-auto" />
                                    <p className="text-sm font-black uppercase text-white mb-8 leading-tight tracking-tight text-center">{ui.confirm.msg}</p>
                                    <div className="flex gap-2">
                                        <button onClick={ui.confirm.fn} className="flex-1 py-4 bg-yellow-500 text-black rounded-xl text-[10px] font-black uppercase transition-all active:scale-95">Yes</button>
                                        <button onClick={() => setUi({...ui, confirm: null})} className="flex-1 py-4 bg-emerald-900 text-yellow-200 rounded-xl text-[10px] font-black uppercase transition-all active:scale-95">No</button>
                                    </div>
                                </div>
                            )}

                            {ui.bust && (
                                <div className={`w-full max-sm rounded-[2.5rem] p-8 shadow-2xl border animate-in zoom-in-95 ${isDarkMode ? 'bg-emerald-950 text-white border-white/5' : 'bg-white border-emerald-100 text-slate-900'}`}>
                                    <div className="text-center mb-8">
                                        <div className="w-16 h-16 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500">
                                            {(() => {
                                                const pIdx = ui.bust.current;
                                                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                                                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                                                );
                                                const locked = safeOpponents.length > 0 && !safeOpponents.some(t => t < 180);
                                                return <Icon name={locked ? "lock" : "soccer-ball"} size={32}/>
                                            })()}
                                        </div>
                                        <h3 className="text-2xl font-black uppercase italic mb-4 tracking-tighter leading-none">Red Card! (Bust)</h3>
                                        <p className="text-[10px] font-bold uppercase opacity-60 px-4 leading-relaxed tracking-tighter text-center">
                                            {players[ui.bust.current]} passed 200. <br/>
                                            {(() => {
                                                const pIdx = ui.bust.current;
                                                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                                                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                                                );
                                                const locked = safeOpponents.length > 0 && !safeOpponents.some(t => t < 180);
                                                return locked 
                                                    ? "Stadium Gates are Closed! Leading defense at 180+ prohibits buy-in." 
                                                    : `Substitute back in for ${ui.bust.target} points?`;
                                            })()}
                                        </p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <button 
                                            onClick={() => solveBust(true)} 
                                            disabled={(() => {
                                                const pIdx = ui.bust.current;
                                                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                                                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                                                );
                                                return safeOpponents.length > 0 && !safeOpponents.some(t => t < 180);
                                            })()} 
                                            className={`py-5 rounded-2xl text-xs font-black uppercase shadow-xl transition-all ${(() => {
                                                const pIdx = ui.bust.current;
                                                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                                                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                                                );
                                                const locked = safeOpponents.length > 0 && !safeOpponents.some(t => t < 180);
                                                return locked ? 'bg-slate-800 text-slate-600 opacity-20 shadow-none cursor-not-allowed' : 'bg-yellow-500 text-black btn-active shadow-lg';
                                            })()}`}
                                        >
                                            Buy-In
                                        </button>
                                        <button onClick={() => solveBust(false)} className="bg-red-600 text-white py-5 rounded-2xl text-xs font-black uppercase btn-active shadow-xl tracking-widest active:scale-95 transition-all">Stay Out</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
