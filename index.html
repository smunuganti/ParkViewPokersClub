<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .sudoku-grid { display: grid; grid-template-columns: repeat(9, 1fr); }
        .cell-border-r { border-right: 3px solid #1e293b; }
        .cell-border-b { border-bottom: 3px solid #1e293b; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SUDOKU ENGINE ---
        const isValid = (grid, r, c, num) => {
            for (let i = 0; i < 9; i++) {
                if (grid[r][i] === num || grid[i][c] === num) return false;
                if (grid[3 * Math.floor(r / 3) + Math.floor(i / 3)][3 * Math.floor(c / 3) + (i % 3)] === num) return false;
            }
            return true;
        };

        const solve = (grid) => {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (grid[r][c] === 0) {
                        const nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
                        for (let n of nums) {
                            if (isValid(grid, r, c, n)) {
                                grid[r][c] = n;
                                if (solve(grid)) return true;
                                grid[r][c] = 0;
                            }
                        }
                        return false;
                    }
                }
            }
            return true;
        };

        const generateGame = (level) => {
            const grid = Array(9).fill().map(() => Array(9).fill(0));
            solve(grid);
            const solution = grid.map(row => [...row]);
            let holes = Math.min(30 + (level * 4), 64);
            while (holes > 0) {
                let r = Math.floor(Math.random() * 9), c = Math.floor(Math.random() * 9);
                if (grid[r][c] !== 0) { grid[r][c] = 0; holes--; }
            }
            return { puzzle: grid, solution };
        };

        // --- UI COMPONENT ---
        function App() {
            const [level, setLevel] = useState(1);
            const [grid, setGrid] = useState([]);
            const [solution, setSolution] = useState([]);
            const [initial, setInitial] = useState([]);
            const [selected, setSelected] = useState([null, null]);

            const init = () => {
                const { puzzle, solution: sol } = generateGame(level);
                setGrid(puzzle);
                setSolution(sol);
                setInitial(puzzle.map(r => [...r]));
            };

            useEffect(() => { init(); }, [level]);

            const handleInput = (num) => {
                const [r, c] = selected;
                if (r !== null && initial[r][c] === 0) {
                    const newGrid = grid.map((row, ri) => row.map((val, ci) => (ri === r && ci === c ? num : val)));
                    setGrid(newGrid);
                    if (newGrid.every((row, ri) => row.every((val, ci) => val === solution[ri][ci]))) {
                        alert(`Level ${level} Cleared!`);
                        setLevel(l => l + 1);
                    }
                }
            };

            if (!grid.length) return <div class="p-10 text-center">Generating Level...</div>;

            return (
                <div className="flex flex-col items-center justify-center p-4">
                    <header className="text-center mb-6">
                        <h1 className="text-4xl font-black text-blue-400">ARCADE SUDOKU</h1>
                        <p className="text-slate-400 font-mono">LEVEL: {level} | DIFFICULTY: {30 + (level * 4)} HOLES</p>
                    </header>

                    <div className="bg-white p-1 rounded-lg shadow-2xl border-4 border-slate-800">
                        <div className="grid grid-cols-9 w-[320px] h-[320px] sm:w-[450px] sm:h-[450px]">
                            {grid.map((row, r) => row.map((cell, c) => (
                                <div 
                                    key={`${r}-${c}`}
                                    onClick={() => setSelected([r, c])}
                                    className={`
                                        flex items-center justify-center text-xl sm:text-2xl cursor-pointer border border-slate-200
                                        ${(c + 1) % 3 === 0 && c !== 8 ? 'cell-border-r' : ''}
                                        ${(r + 1) % 3 === 0 && r !== 8 ? 'cell-border-b' : ''}
                                        ${selected[0] === r && selected[1] === c ? 'bg-blue-200' : ''}
                                        ${initial[r][c] !== 0 ? 'text-slate-900 font-bold' : 'text-blue-600'}
                                    `}
                                >
                                    {cell !== 0 ? cell : ''}
                                </div>
                            )))}
                        </div>
                    </div>

                    <div className="grid grid-cols-5 gap-2 mt-8">
                        {[1,2,3,4,5,6,7,8,9,0].map(n => (
                            <button 
                                key={n} 
                                onClick={() => handleInput(n)}
                                className="w-14 h-12 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold shadow-lg transition-transform active:scale-90"
                            >
                                {n === 0 ? 'CLR' : n}
                            </button>
                        ))}
                    </div>

                    <div className="mt-8 flex gap-4">
                        <button onClick={() => setGrid(solution)} className="text-xs text-slate-500 hover:text-white underline">Cheat (Auto-Solve)</button>
                        <button onClick={init} className="text-xs text-slate-500 hover:text-white underline">Reset Level</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
