<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    
    <!-- Deployment Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rummy Scorer">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Monsoon Icons -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%231e293b%22/><text y=%22.9em%22 font-size=%2280%22 x=%2210%22>🌧️</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌧️</text></svg>">

    <title>Rummy Scorer - Rainy Season 2026 Production</title>
    
    <!-- Core Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Screenshot Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* RAINY DAY ANIMATIONS */
        @keyframes rain-fall {
            0% { transform: translateY(-25vh); opacity: 0; }
            15% { opacity: var(--drop-opacity); }
            85% { opacity: var(--drop-opacity); }
            100% { transform: translateY(110vh); opacity: 0; }
        }
        @keyframes cloud-pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.3)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 30px rgba(56, 189, 248, 0.6)); }
        }
        @keyframes lightning-flash {
            0%, 96%, 100% { opacity: 0; }
            97% { opacity: 0.6; }
            98% { opacity: 0.1; }
            99% { opacity: 0.4; }
        }
        @keyframes storm-aura {
            0% { opacity: 0.2; transform: scale(1); filter: blur(50px); }
            50% { opacity: 0.4; transform: scale(1.2); filter: blur(80px); }
            100% { opacity: 0.2; transform: scale(1); filter: blur(50px); }
        }
        @keyframes bg-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animate-rain { animation: rain-fall linear infinite; }
        .animate-cloud { animation: cloud-pulse 4s ease-in-out infinite; }
        .animate-flash { animation: lightning-flash 12s infinite; }
        .animate-storm { animation: storm-aura 7s ease-in-out infinite; }
        
        /* High-End Multicolor Background */
        .monsoon-bg-multicolor {
            background: linear-gradient(-45deg, #0f172a, #1e293b, #334155, #1e1b4b, #0f172a);
            background-size: 400% 400%;
            animation: bg-shift 18s ease infinite;
        }

        .light-monsoon-bg {
            background: linear-gradient(-45deg, #f1f5f9, #e2e8f0, #deeaf3, #f1f5f9);
            background-size: 400% 400%;
            animation: bg-shift 18s ease infinite;
        }

        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body {
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            user-select: none;
            height: 100vh;
            width: 100vw;
            background-color: #0f172a;
            transition: background-color 0.5s ease;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-active:active { transform: scale(0.96); }
        input { user-select: text; }
        
        .pt-safe { padding-top: env(safe-area-inset-top); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

        .rain-text { color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        .storm-glow { text-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }

        /* Grey State Implementation */
        .player-inactive {
            filter: grayscale(1) !important;
            opacity: 0.25 !important;
            pointer-events: none;
        }
        .total-inactive {
            text-decoration: line-through;
            opacity: 0.4;
        }
    </style>
</head>
<body id="app-body">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.lucide) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}" style="width:${size}px;height:${size}px;"></i>`;
                    window.lucide.createIcons({ targets: [containerRef.current] });
                }
            }, [name, size]);
            return <span ref={containerRef} className={`inline-flex items-center justify-center shrink-0 ${className}`} style={{ width: size, height: size }}></span>;
        };

        const STORAGE_KEY = "rummy_scorer_prod_v198_final";
        const THEME_KEY = "rummy_scorer_theme_pref";
        const DEFAULT_ROSTER = ['Player 1', 'Player 2', 'Player 3'];

        // --- Visual Components ---

        const RainAnimation = () => {
            const drops = useMemo(() => {
                return Array.from({ length: 60 }).map((_, i) => ({
                    id: i,
                    left: Math.random() * 100,
                    opacity: 0.1 + Math.random() * 0.4,
                    duration: 0.4 + Math.random() * 0.6,
                    delay: Math.random() * 5,
                    width: 1.2 + Math.random() * 0.8,
                    height: 25 + Math.random() * 35
                }));
            }, []);

            return (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-10">
                    {drops.map(drop => (
                        <div key={drop.id} className="absolute animate-rain" style={{ 
                            left: `${drop.left}%`, 
                            top: '-60px',
                            width: `${drop.width}px`,
                            height: `${drop.height}px`,
                            background: `linear-gradient(to bottom, transparent, rgba(56, 189, 248, ${drop.opacity}))`,
                            borderRadius: '2px 2px 0 0',
                            filter: 'blur(0.4px)',
                            '--drop-opacity': drop.opacity,
                            animationDuration: `${drop.duration}s`, 
                            animationDelay: `${drop.delay}s` 
                        }}></div>
                    ))}
                    <div className="absolute inset-0 bg-sky-100 animate-flash pointer-events-none"></div>
                </div>
            );
        };

        const RainyCenterpiece = () => (
            <div className="relative w-48 h-64 flex items-center justify-center">
                <div className="absolute w-80 h-80 bg-blue-500 rounded-full blur-[100px] animate-storm"></div>
                <div className="absolute w-60 h-60 bg-slate-600 rounded-full blur-[60px] animate-storm delay-1000"></div>
                <div className="relative z-10 animate-cloud flex flex-col items-center">
                    <div className="text-slate-300">
                        <svg width="150" height="150" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17.5,19c0,0.3-0.1,0.5-0.2,0.8c-0.2,0.3-0.5,0.2-0.8,0.2c-0.3,0-0.5-0.1-0.8-0.2c-0.3-0.2-0.2-0.5-0.2-0.8 c0-0.3,0.1-0.5,0.2-0.8c0.2-0.3,0.5-0.2,0.8-0.2c0.3,0,0.5,0.1,0.8,0.2C17.4,18.5,17.5,18.7,17.5,19z M13.5,21 c0,0.3-0.1,0.5-0.2,0.8c-0.2,0.3-0.5,0.2-0.8,0.2c-0.3,0-0.5-0.1-0.8-0.2c-0.3-0.2-0.2-0.5-0.2-0.8s0.1-0.5,0.2-0.8 c0.2-0.3,0.5-0.2,0.8-0.2c0.3,0,0.5,0.1,0.8,0.2C13.4,20.5,13.5,20.7,13.5,21z M9.5,19c0,0.3-0.1,0.5-0.2,0.8 c-0.2,0.3-0.5,0.2-0.8,0.2c-0.3,0-0.5-0.1-0.8-0.2c-0.3-0.2-0.2-0.5-0.2-0.8c0-0.3,0.1-0.5,0.2-0.8c0.2-0.3,0.5-0.2,0.8-0.2 c0.3,0,0.5,0.1,0.8,0.2C9.4,18.5,9.5,18.7,9.5,19z M19.3,15.1C20.9,13.9,22,12.1,22,10c0-3.3-2.7-6-6-6c-0.1,0-0.2,0-0.3,0 c-1.3-1.8-3.4-3-5.7-3c-3.9,0-7,3.1-7,7c0,0.3,0,0.5,0.1,0.8C1.3,10.2,0,11.9,0,14c0,2.8,2.2,5,5,5h14c2.2,0,4-1.8,4-4 C23,13.1,21.4,11.5,19.3,15.1z" />
                        </svg>
                    </div>
                    <div className="mt-[-80px] text-yellow-400 drop-shadow-[0_0_10px_rgba(250,204,21,0.6)]">
                         <svg width="40" height="60" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                         </svg>
                    </div>
                </div>
            </div>
        );

        const CountdownTimer = ({ isDarkMode }) => {
            const [timeLeft, setTimeLeft] = useState({ d: 0, h: 0, m: 0, s: 0, finished: false });

            useEffect(() => {
                const targetDate = new Date("2026-06-01T00:00:00").getTime();
                const timer = setInterval(() => {
                    const now = new Date().getTime();
                    const diff = targetDate - now;
                    if (diff <= 0) {
                        setTimeLeft({ d: 0, h: 0, m: 0, s: 0, finished: true });
                        clearInterval(timer);
                    } else {
                        setTimeLeft({
                            d: Math.floor(diff / (1000 * 60 * 60 * 24)),
                            h: Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                            m: Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)),
                            s: Math.floor((diff % (1000 * 60)) / 1000),
                            finished: false
                        });
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="flex flex-col items-center mb-6 relative z-20">
                    <div className="text-[10px] font-black uppercase tracking-[0.5em] mb-3 opacity-70 rain-text">Monsoon 2026 Season Launch</div>
                    <div className="flex gap-4">
                        {[
                            { label: 'Days', value: timeLeft.d },
                            { label: 'Hrs', value: timeLeft.h },
                            { label: 'Min', value: timeLeft.m },
                            { label: 'Sec', value: timeLeft.s }
                        ].map((unit, i) => (
                            <div key={i} className="flex flex-col items-center">
                                <div className={`text-3xl font-black tabular-nums tracking-tighter ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                                    {String(unit.value).padStart(2, '0')}
                                </div>
                                <div className="text-[8px] font-bold uppercase tracking-widest opacity-40">{unit.label}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- Core Application ---

        const App = () => {
            const [showWelcome, setShowWelcome] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const saved = localStorage.getItem(THEME_KEY);
                return saved === null ? true : saved === 'true';
            });

            const [game, setGame] = useState(() => {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) return JSON.parse(data);
                return { players: DEFAULT_ROSTER, rounds: [], history: [], inactive: [], reEntries: new Array(DEFAULT_ROSTER.length).fill(0) };
            });

            const [ui, setUi] = useState({ add: false, editIdx: null, settings: false, history: false, bust: null, confirm: null, isSharing: false });
            const [form, setForm] = useState({ scores: {}, name: '', editIdx: null, editVal: '', error: null });
            const scrollRef = useRef(null);

            const players = game.players;
            const rounds = game.rounds;
            const sessionHistory = game.history || [];
            const inactive = game.inactive || [];
            const reEntries = game.reEntries || new Array(players.length).fill(0);

            const totals = useMemo(() => players.map((_, pIdx) => rounds.reduce((sum, r) => sum + (Array.isArray(r) ? (r[pIdx] || 0) : 0), 0)), [players, rounds]);
            const activeTotals = useMemo(() => totals.filter((_, i) => !inactive.includes(i)), [totals, inactive]);
            const leaderIdx = useMemo(() => rounds.length === 0 ? -1 : totals.findIndex((t, i) => !inactive.includes(i) && t === Math.min(...activeTotals)), [totals, inactive, activeTotals, rounds]);
            const matchOver = (players.length - inactive.length) <= 1 && rounds.length > 0;

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(game));
                localStorage.setItem(THEME_KEY, isDarkMode.toString());
                if (!showWelcome) document.body.style.backgroundColor = isDarkMode ? "#0f172a" : "#f1f5f9";
            }, [game, isDarkMode, showWelcome]);

            useEffect(() => {
                if (!showWelcome && scrollRef.current && game.rounds.length > 0) {
                    scrollRef.current.scrollTo({ top: scrollRef.current.scrollHeight, behavior: 'smooth' });
                }
            }, [game.rounds, showWelcome]);

            // Locked logic functions
            const isPlayerLocked = (pIdx) => {
                if (!ui.bust) return false;
                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                );
                if (safeOpponents.length === 0) return false; 
                return !safeOpponents.some(t => t < 180);
            };

            const submitScores = (isEditing = false) => {
                setForm(f => ({ ...f, error: null }));
                const entry = players.map((p, i) => inactive.includes(i) ? 0 : parseInt(form.scores[p] || 0));
                
                if (entry.filter((s, i) => !inactive.includes(i) && s === 0).length !== 1) {
                    setForm(f => ({ ...f, error: "One winner (score 0) is required." })); return;
                }

                if (isEditing) {
                    const up = [...rounds]; up[ui.editIdx] = entry;
                    setGame(g => ({ ...g, rounds: up }));
                    setUi(u => ({ ...u, editIdx: null })); setForm(f => ({ ...f, scores: {} }));
                } else {
                    const proj = totals.map((t, i) => t + (entry[i] || 0));
                    const bustedIdxs = proj.map((t, i) => (!inactive.includes(i) && t > 200) ? i : -1).filter(i => i !== -1);
                    
                    if (bustedIdxs.length > 0) {
                        const safePlayers = proj.filter((t, i) => !bustedIdxs.includes(i) && !inactive.includes(i));
                        const target = (safePlayers.length > 0 ? Math.max(...safePlayers) : 0) + 1;
                        setUi(u => ({ ...u, bust: { idxs: bustedIdxs, current: bustedIdxs[0], target, pending: entry, proj } }));
                    } else {
                        setGame(g => ({ ...g, rounds: [...g.rounds, entry] }));
                        setUi(u => ({ ...u, add: false })); setForm(f => ({ ...f, scores: {} }));
                    }
                }
            };

            const solveBust = (rejoin) => {
                const scores = [...ui.bust.pending];
                const pIdx = ui.bust.current;
                const locked = isPlayerLocked(pIdx);
                let upIn = [...inactive]; let upRe = [...reEntries];

                if (rejoin && !locked) {
                    scores[pIdx] = ui.bust.target - totals[pIdx];
                    upRe[pIdx] = (upRe[pIdx] || 0) + 1;
                } else {
                    if (!upIn.includes(pIdx)) upIn.push(pIdx);
                }

                const remaining = ui.bust.idxs.filter(i => i !== pIdx);
                if (remaining.length === 0) {
                    setGame(g => ({ ...g, inactive: upIn, reEntries: upRe, rounds: [...g.rounds, scores] }));
                    setUi(u => ({ ...u, bust: null, add: false })); setForm(f => ({ ...f, scores: {} }));
                } else {
                    setGame(g => ({ ...g, inactive: upIn, reEntries: upRe }));
                    setUi(u => ({ ...u, bust: { ...u.bust, current: remaining[0], idxs: remaining, pending: scores } }));
                }
            };

            const midGameJoin = () => {
                if(!form.name.trim()) return;
                const activeHigh = activeTotals.length > 0 ? Math.max(...activeTotals) : Math.max(...totals);
                const joinScore = activeHigh + 1;
                setGame(g => ({
                    ...g, players: [...g.players, form.name.trim()], 
                    reEntries: [...(g.reEntries || new Array(g.players.length).fill(0)), 0],
                    rounds: g.rounds.map((r, i) => i === 0 ? [...r, joinScore] : [...r, 0])
                }));
                setForm(f => ({ ...f, name: '' }));
            };

            const savePlayerNameEdit = (idx) => {
                if (!form.editVal.trim()) return;
                const up = [...players]; up[idx] = form.editVal.trim();
                setGame(prev => ({ ...prev, players: up }));
                setForm(f => ({ ...f, editIdx: null, editVal: '' }));
            };

            const startNewMatch = () => {
                if (rounds.length === 0) return;
                setUi(u => ({ ...u, confirm: { msg: "Archive this session and head to shelter?", fn: () => {
                    const summary = { id: Date.now(), ts: Date.now(), players: [...players], rounds: [...rounds], inactive: [...inactive], reEntries: [...reEntries], finalScores: [...totals] };
                    setGame(prev => ({ ...prev, rounds: [], inactive: [], reEntries: new Array(prev.players.length).fill(0), history: [summary, ...(prev.history || [])].slice(0, 10) }));
                    setUi(prevUi => ({ ...prevUi, confirm: null }));
                }}}));
            };

            const restoreSession = (log) => {
                setUi({ ...ui, confirm: { msg: "Restore session? Current match will be lost.", fn: () => {
                    setGame(prev => ({ 
                        ...prev, 
                        players: log.players, 
                        rounds: log.rounds, 
                        inactive: log.inactive || [], 
                        reEntries: log.reEntries || new Array(log.players.length).fill(0) 
                    }));
                    setUi(u => ({ ...u, history: false, confirm: null }));
                }}});
            };

            const shareAsScreenshot = async () => {
                const element = document.getElementById('scoreboard-capture');
                if (!element || !window.html2canvas) return;
                setUi(prev => ({ ...prev, isSharing: true }));
                try {
                    const canvas = await html2canvas(element, {
                        backgroundColor: isDarkMode ? "#0f172a" : "#f1f5f9",
                        scale: 2, logging: false, useCORS: true,
                        ignoreElements: (el) => el.tagName === 'NAV' || el.classList.contains('p-5')
                    });
                    canvas.toBlob(async (blob) => {
                        if (!blob) return;
                        const file = new File([blob], "monsoon-standings.png", { type: "image/png" });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try { await navigator.share({ files: [file], title: 'Rummy Scorer Standings' }); } catch (e) {
                                const link = document.createElement('a'); link.download = 'rummy-standings.png'; link.href = URL.createObjectURL(blob); link.click();
                            }
                        } else {
                            const link = document.createElement('a'); link.download = 'rummy-standings.png'; link.href = URL.createObjectURL(blob); link.click();
                        }
                        setUi(prev => ({ ...prev, isSharing: false }));
                    }, "image/png");
                } catch (error) {
                    setUi(prev => ({ ...prev, isSharing: false }));
                }
            };

            if (showWelcome) {
                return (
                    <div className={`fixed inset-0 flex flex-col items-center justify-center p-8 transition-colors duration-500 overflow-hidden ${isDarkMode ? 'monsoon-bg-multicolor text-white' : 'light-monsoon-bg text-slate-900'}`}>
                        <RainAnimation />
                        <div className="max-w-md w-full text-center relative z-10 flex flex-col items-center">
                            <CountdownTimer isDarkMode={isDarkMode} />
                            <RainyCenterpiece />
                            <div className={`text-6xl font-black italic tracking-tighter storm-glow drop-shadow-2xl mt-4 leading-none`}>2026</div>
                            <h1 className="text-3xl font-black uppercase italic mb-1 tracking-tighter text-blue-100 storm-glow">Rummy Scorer</h1>
                            <h2 className="text-5xl font-black uppercase tracking-widest leading-none text-white/20 mb-12">Monsoon</h2>
                            <div className="flex gap-2 w-full max-w-xs">
                                <button onClick={() => setShowWelcome(false)} className={`flex-1 h-16 bg-blue-600 hover:bg-blue-500 text-white rounded-3xl font-black uppercase tracking-[0.2em] shadow-2xl active:scale-95 transition-all flex items-center justify-center gap-3 border border-blue-400/30`}>Open Ledger</button>
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className={`w-16 h-16 rounded-3xl flex items-center justify-center shadow-2xl active:scale-95 transition-all bg-slate-900/50 text-blue-400 border border-blue-500/20`}><Icon name={isDarkMode ? "sun" : "moon"} /></button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`fixed inset-0 flex flex-col transition-colors duration-500 overflow-hidden ${isDarkMode ? 'bg-[#0f172a] text-slate-100' : 'bg-[#f1f5f9] text-slate-900'}`}>
                    <RainAnimation />
                    <nav className={`flex-none px-4 py-4 z-40 pt-safe border-b backdrop-blur-xl ${isDarkMode ? 'bg-slate-900/70 border-white/5' : 'bg-white/90 border-slate-200 shadow-sm'}`}>
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-2 group">
                                <button onClick={() => setShowWelcome(true)} className="w-10 h-10 rounded-2xl flex items-center justify-center text-white shadow-lg bg-blue-600 active:scale-90 transition-all"><Icon name="cloud-rain" /></button>
                                <div className="text-left leading-none"><h1 className="text-[11px] font-black uppercase tracking-tight text-blue-400">Rummy Scorer</h1><span className="text-[9px] font-bold uppercase opacity-80 italic">Monsoon Edition</span></div>
                            </div>
                            <div className="flex items-center gap-1">
                                <button onClick={startNewMatch} className="p-2 opacity-70 hover:opacity-100 text-blue-500 active:scale-90 transition-all"><Icon name="rotate-ccw" /></button>
                                <button onClick={() => setUi({...ui, history: true})} className="p-2 opacity-70 active:scale-90 transition-all"><Icon name="history" /></button>
                                <button onClick={() => setUi({...ui, settings: true})} className="p-2 opacity-70 active:scale-90 transition-all"><Icon name="settings-2" /></button>
                            </div>
                        </div>
                    </nav>

                    <div id="scoreboard-capture" className="flex-1 flex flex-col overflow-hidden relative">
                        <div className={`flex-none flex border-b-2 z-20 ${isDarkMode ? 'bg-slate-950/60 border-white/5 shadow-lg' : 'bg-white shadow-sm'}`}>
                            <div className="w-10 flex items-center justify-center text-[8px] font-black text-slate-500 italic uppercase leading-none">Deal</div>
                            <div className="flex-1 flex">
                                {players.map((p, i) => (
                                    <div key={i} className={`flex-1 border-r last:border-r-0 py-3 text-center truncate transition-all duration-500 ${inactive.includes(i) ? 'player-inactive bg-black/10' : ''}`}>
                                        <div className="flex flex-col items-center justify-center px-0.5 min-w-0">
                                            <span className={`text-[10px] font-black uppercase truncate block w-full tracking-tight ${isDarkMode ? 'text-blue-400' : 'text-slate-800'}`}>{p}</span>
                                            {reEntries[i] > 0 && <span className="bg-slate-800 text-white text-[6px] px-1 rounded-sm leading-none py-1 font-black">R{reEntries[i]}</span>}
                                            {inactive.includes(i) && <span className="text-[6px] text-rose-500 font-bold uppercase mt-1 italic leading-none">OUT</span>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div ref={scrollRef} className="flex-1 overflow-y-auto no-scrollbar bg-black/5">
                            {rounds.map((round, rIdx) => (
                                <div key={rIdx} className={`flex border-b transition-colors ${isDarkMode ? 'border-white/5 hover:bg-white/5' : 'border-blue-50 hover:bg-white'}`}>
                                    <div className="w-10 flex flex-col items-center justify-center py-4"><span className="text-[10px] font-bold text-slate-500 italic">{rIdx + 1}</span><button onClick={() => { setUi({...ui, editIdx: rIdx}); const c = {}; players.forEach((p, i) => c[p] = round[i]); setForm({...form, scores: c}); }} className="text-blue-500/40 mt-1 active:scale-90 transition-all"><Icon name="pencil-line" size={12} /></button></div>
                                    <div className="flex-1 flex">
                                        {round.map((score, cIdx) => (
                                            <div key={cIdx} className={`flex-1 border-r last:border-r-0 flex items-center justify-center py-4 transition-all duration-500 ${inactive.includes(cIdx) ? 'opacity-20 grayscale' : ''}`}>
                                                {score === 0 ? <span className="w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center text-[10px] font-black shadow-md border border-white/20">0</span> : <span className="text-sm font-bold tabular-nums">{score}</span>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className={`flex-none flex text-white shadow-[0_-10px_30px_rgba(0,0,0,0.3)] z-30 transition-colors ${isDarkMode ? 'bg-slate-900 border-t border-white/5' : 'bg-slate-700 shadow-xl'}`}>
                            <div className="w-10 flex items-center justify-center text-[8px] font-black italic bg-black/20 text-blue-200 uppercase leading-tight">Total</div>
                            <div className="flex-1 flex">
                                {totals.map((total, i) => (
                                    <div key={i} className={`flex-1 py-4 border-r last:border-r-0 border-white/5 text-center font-black text-lg min-w-0 transition-all duration-500 ${inactive.includes(i) ? 'total-inactive grayscale' : ''}`}>
                                        <span className="flex items-center justify-center gap-1">{total} {i === leaderIdx && !inactive.includes(i) && rounds.length > 0 && <Icon name="cloud-rain" size={14} className="text-blue-400 animate-bounce" />}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className={`p-5 pb-safe flex-none border-t z-20 ${isDarkMode ? 'bg-slate-950/90 border-white/5' : 'bg-white border-slate-100 shadow-xl'}`}>
                        {matchOver ? (
                            <div className="text-center p-2 animate-in zoom-in-95 duration-500"><h4 className="text-xl font-black italic text-blue-600 uppercase mb-3 text-center">Storm Over!</h4><button onClick={startNewMatch} className="px-10 py-4 bg-blue-600 text-white rounded-full text-xs font-black uppercase active:scale-95 transition-all shadow-xl">New Match</button></div>
                        ) : (
                            <div className="flex gap-2 max-w-lg mx-auto">
                                <button onClick={() => setUi({...ui, add: true})} className="flex-1 h-16 bg-blue-600 hover:bg-blue-700 text-white rounded-3xl font-black uppercase tracking-widest shadow-xl flex items-center justify-center gap-3 active:scale-95 transition-all"><Icon name="plus" size={24} /> Record Hand</button>
                                <button onClick={shareAsScreenshot} disabled={ui.isSharing} className={`px-6 h-16 rounded-2xl font-black shadow-xl flex items-center justify-center transition-all active:scale-95 ${isDarkMode ? 'bg-slate-900 text-blue-400' : 'bg-blue-50 text-blue-800'} ${ui.isSharing ? 'animate-pulse' : ''}`}>
                                    {ui.isSharing ? <Icon name="loader-2" size={24} className="animate-spin" /> : <Icon name="camera" size={24} />}
                                </button>
                            </div>
                        )}
                    </div>

                    {/* MODAL SYSTEM */}
                    {(ui.add || ui.editIdx !== null || ui.settings || ui.history || ui.bust || ui.confirm) && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm animate-in fade-in">
                            
                            {(ui.add || ui.editIdx !== null) && (
                                <div className={`w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl border animate-in slide-in-from-bottom-10 ${isDarkMode ? 'bg-slate-900 border-white/5 text-white' : 'bg-white border-slate-100 text-slate-900'}`}>
                                    <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-black text-blue-500 uppercase italic">{ui.editIdx !== null ? "Edit Hand" : "New Entry"}</h3><button onClick={() => setUi({...ui, add: false, editIdx: null})} className="text-slate-500 p-2"><Icon name="x" size={28} /></button></div>
                                    {form.error && <div className="mb-4 bg-rose-500/10 p-3 rounded-xl text-[10px] font-black text-rose-500 uppercase animate-bounce">{form.error}</div>}
                                    <div className="grid grid-cols-2 gap-4 mb-8 max-h-[40vh] overflow-y-auto pr-1 no-scrollbar">{players.map((p, idx) => !inactive.includes(idx) && (<div key={idx} className="flex flex-col gap-2"><label className="text-[10px] font-black uppercase text-blue-500 truncate">{p}</label><input type="number" inputMode="numeric" value={form.scores[p] || ''} onChange={e => setForm({...form, scores: {...form.scores, [p]: e.target.value}})} className={`w-full p-5 rounded-2xl text-center text-3xl font-black outline-none border transition-all ${isDarkMode ? 'bg-slate-950 border-white/5 text-blue-400' : 'bg-slate-50 border-slate-100 text-slate-900'}`} placeholder="0" /></div>))}</div>
                                    <button onClick={() => submitScores(ui.editIdx !== null)} className="w-full bg-blue-600 hover:bg-blue-500 py-6 rounded-3xl font-black uppercase shadow-xl text-white tracking-widest active:scale-95 transition-all">Confirm Hand</button>
                                </div>
                            )}

                            {ui.settings && (
                                <div className={`w-full max-sm rounded-[2.5rem] p-8 shadow-2xl border ${isDarkMode ? 'bg-slate-900 border-white/5 text-white' : 'bg-white border-slate-100 text-slate-900'}`}>
                                    <h3 className="text-xl font-black text-blue-500 uppercase mb-8 flex items-center gap-3 tracking-tighter"><Icon name="users" /> Registry</h3>
                                    <input type="text" value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Player Name" className={`w-full p-5 rounded-2xl mb-4 font-bold outline-none border ${isDarkMode ? 'bg-slate-950 border-white/5 text-blue-400' : 'bg-slate-50 border-slate-100'}`} />
                                    <div className="grid grid-cols-2 gap-2 mb-8">
                                        <button onClick={() => { if(form.name) { setGame(g=>({...g, players: [...g.players, form.name.trim()], rounds: [], inactive: [], reEntries: new Array(g.players.length+1).fill(0)})); setForm(f=>({...f, name:''})); setUi(u=>({...u, settings: false})); }}} className={`py-4 rounded-2xl text-[10px] font-black uppercase border active:scale-95 transition-all border-white/10 bg-slate-800`}>Reset Pitch</button>
                                        <button onClick={midGameJoin} className="py-4 bg-blue-600 text-white rounded-2xl text-[10px] font-black uppercase shadow-lg active:scale-95 transition-all">Join @ Max+1</button>
                                    </div>
                                    <div className="space-y-2 mb-8 max-h-48 overflow-y-auto no-scrollbar">
                                        {players.map((p, i) => (
                                            <div key={i} className={`flex items-center justify-between p-4 rounded-2xl border transition-all duration-500 ${isDarkMode ? 'bg-slate-900 border-white/5' : 'bg-slate-50 border-slate-100 shadow-sm'} ${inactive.includes(i) ? 'opacity-30 grayscale' : ''}`}>
                                                {form.editIdx === i ? (
                                                    <div className="flex-1 flex gap-2 min-w-0">
                                                        <input type="text" value={form.editVal} onChange={e => setForm({...form, editVal: e.target.value})} className="flex-1 bg-black/40 px-3 py-1 rounded text-[10px] font-black uppercase outline-none text-blue-400 min-w-0" autoFocus />
                                                        <button onClick={() => savePlayerNameEdit(i)} className="text-emerald-500 shrink-0"><Icon name="check-circle-2" /></button>
                                                    </div>
                                                ) : (
                                                    <>
                                                        <span className="text-[10px] font-black uppercase truncate max-w-[120px]">{p} {inactive.includes(i) && <span className="ml-1 text-[8px]">(OUT)</span>}</span>
                                                        <div className="flex gap-1 shrink-0">
                                                            <button onClick={() => setForm({...form, editIdx: i, editVal: p})} className="p-2 opacity-50 text-blue-500"><Icon name="pencil" size={16}/></button>
                                                            {players.length > 2 && <button onClick={() => setUi({ ...ui, confirm: { msg: `Remove player ${p}? Session will reset.`, fn: () => { setGame({...game, players: players.filter((_, idx) => idx !== i), rounds: [], inactive: []}); setUi({...ui, confirm: null}); } } })} className="text-rose-500 p-2"><Icon name="user-minus" size={18}/></button>}
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => setUi({...ui, settings: false})} className="w-full py-5 bg-slate-950 text-white rounded-2xl font-black uppercase text-xs active:scale-95 transition-all border border-white/5 text-center">Close Registry</button>
                                </div>
                            )}

                            {ui.history && (
                                <div className={`w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl border ${isDarkMode ? 'bg-slate-950 border-white/5 text-white' : 'bg-white border-slate-100 text-slate-900'}`}>
                                    <h3 className="text-xl font-black text-blue-500 uppercase mb-6 flex items-center gap-3 tracking-tighter"><Icon name="history" /> History Log</h3>
                                    <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-1 no-scrollbar">
                                        {sessionHistory.length === 0 ? <div className="py-20 text-center opacity-20 text-xs font-black uppercase italic tracking-widest text-center">Empty Logs</div> : sessionHistory.map((log) => (
                                            <div key={log.id} className={`p-4 rounded-2xl border ${isDarkMode ? 'bg-slate-900 border-white/5 shadow-inner' : 'bg-slate-50 border-slate-100 shadow-sm'}`}>
                                                <div className="flex justify-between mb-3 border-b border-white/5 pb-2 text-blue-400 font-black tracking-widest">
                                                    <span className="text-[10px]">{new Date(log.id).toLocaleDateString()}</span>
                                                    <button onClick={() => restoreSession(log)} className="text-[8px] bg-blue-600 text-white px-2 py-1 rounded font-black uppercase active:scale-90 transition-all">Restore</button>
                                                </div>
                                                <div className="grid grid-cols-2 gap-2">
                                                    {log.players.map((pName, pIdx) => (
                                                        <div key={pIdx} className="flex items-center justify-between text-[10px] opacity-80 truncate">
                                                            <span className="truncate">{pName}</span>
                                                            <span className="font-bold">{log.finalScores[pIdx]}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => setUi({...ui, history: false})} className="w-full mt-8 py-5 bg-slate-950 text-white rounded-2xl font-black uppercase text-xs active:scale-95 transition-all border border-white/5 text-center">Close</button>
                                </div>
                            )}

                            {ui.confirm && (
                                <div className="w-full max-w-xs rounded-[2.5rem] p-8 bg-slate-950 border border-white/10 text-center shadow-2xl animate-in zoom-in-95">
                                    <Icon name="alert-triangle" size={32} className="text-blue-400 mb-4 mx-auto" />
                                    <p className="text-sm font-black uppercase text-blue-100 mb-8 leading-tight tracking-tight text-center">{ui.confirm.msg}</p>
                                    <div className="flex gap-2">
                                        <button onClick={ui.confirm.fn} className="flex-1 py-4 bg-blue-600 text-white rounded-xl text-[10px] font-black uppercase transition-all active:scale-95">Yes</button>
                                        <button onClick={() => setUi({...ui, confirm: null})} className="flex-1 py-4 bg-slate-900 text-blue-200 rounded-xl text-[10px] font-black uppercase transition-all active:scale-95">No</button>
                                    </div>
                                </div>
                            )}

                            {ui.bust && (
                                <div className={`w-full max-sm rounded-[2.5rem] p-8 shadow-2xl border animate-in zoom-in-95 ${isDarkMode ? 'bg-slate-950 text-white border-white/5' : 'bg-white border-slate-100 text-slate-900'}`}>
                                    <div className="text-center mb-8">
                                        <div className="w-16 h-16 bg-blue-500/10 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-500">
                                            {(() => {
                                                const pIdx = ui.bust.current;
                                                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                                                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                                                );
                                                const locked = safeOpponents.length > 0 && !safeOpponents.some(t => t < 180);
                                                return <Icon name={locked ? "lock" : "cloud-rain"} size={32}/>
                                            })()}
                                        </div>
                                        <h3 className="text-2xl font-black uppercase italic mb-4 tracking-tighter leading-none">Flood Warning! (Bust)</h3>
                                        <p className="text-xs font-bold uppercase opacity-60 px-4 leading-relaxed tracking-tighter text-center">
                                            {players[ui.bust.current]} passed 200. <br/>
                                            {(() => {
                                                const pIdx = ui.bust.current;
                                                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                                                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                                                );
                                                const locked = safeOpponents.length > 0 && !safeOpponents.some(t => t < 180);
                                                return locked 
                                                    ? "The Shelter is Locked. Safe player at 180+ prohibits entry." 
                                                    : `Re-buy for ${ui.bust.target} points?`;
                                            })()}
                                        </p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <button 
                                            onClick={() => solveBust(true)} 
                                            disabled={(() => {
                                                const pIdx = ui.bust.current;
                                                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                                                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                                                );
                                                return safeOpponents.length > 0 && !safeOpponents.some(t => t < 180);
                                            })()} 
                                            className={`py-5 rounded-2xl text-xs font-black uppercase shadow-xl transition-all ${(() => {
                                                const pIdx = ui.bust.current;
                                                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                                                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                                                );
                                                const locked = safeOpponents.length > 0 && !safeOpponents.some(t => t < 180);
                                                return locked ? 'bg-slate-800 text-slate-600 opacity-20 shadow-none cursor-not-allowed' : 'bg-blue-600 text-white btn-active shadow-lg';
                                            })()}`}
                                        >
                                            Re-entry
                                        </button>
                                        <button onClick={() => solveBust(false)} className="bg-rose-700 text-white py-5 rounded-2xl text-xs font-black uppercase btn-active shadow-xl tracking-widest active:scale-95 transition-all">Stay Out</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
