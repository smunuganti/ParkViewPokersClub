<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    
    <!-- Deployment Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rummy Scorer">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0ea5e9">
    
    <!-- Summer Icons -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230ea5e9%22/><text y=%22.9em%22 font-size=%2280%22 x=%2210%22>☀️</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☀️</text></svg>">

    <title>Rummy Scorer - Summer Holidays 2026 Production</title>
    
    <!-- Core Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* SUMMER ANIMATIONS */
        @keyframes item-float {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.6); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(105vh) rotate(360deg) scale(1.1); opacity: 0; }
        }
        @keyframes sun-pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.5)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 40px rgba(251, 191, 36, 0.9)); }
        }
        @keyframes wave-glow {
            0% { opacity: 0.3; transform: scale(1); filter: blur(40px); }
            50% { opacity: 0.6; transform: scale(1.15); filter: blur(60px); }
            100% { opacity: 0.3; transform: scale(1); filter: blur(40px); }
        }
        @keyframes bg-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animate-float { animation: item-float 9s linear infinite; }
        .animate-sun { animation: sun-pulse 4s ease-in-out infinite; }
        .animate-waves { animation: wave-glow 6s ease-in-out infinite; }
        
        .summer-bg-multicolor {
            background: linear-gradient(-45deg, #0ea5e9, #22d3ee, #f59e0b, #fbbf24, #0ea5e9);
            background-size: 400% 400%;
            animation: bg-shift 15s ease infinite;
        }

        .light-summer-bg {
            background: linear-gradient(-45deg, #f0f9ff, #ecfeff, #fffbeb, #fff7ed, #f0f9ff);
            background-size: 400% 400%;
            animation: bg-shift 15s ease infinite;
        }

        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body {
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            user-select: none;
            height: 100vh;
            width: 100vw;
            background-color: #0ea5e9;
            transition: background-color 0.5s ease;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-active:active { transform: scale(0.96); }
        input { user-select: text; }
        
        .pt-safe { padding-top: env(safe-area-inset-top); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

        .summer-text { color: #0369a1; text-shadow: 0 0 10px rgba(14, 165, 233, 0.3); }
        .sun-glow { text-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }

        /* Grey State Implementation */
        .player-inactive {
            filter: grayscale(1) !important;
            opacity: 0.25 !important;
            pointer-events: none;
        }
        .total-inactive {
            text-decoration: line-through;
            opacity: 0.4;
        }
    </style>
</head>
<body id="app-body">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.lucide) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}" style="width:${size}px;height:${size}px;"></i>`;
                    window.lucide.createIcons({ targets: [containerRef.current] });
                }
            }, [name, size]);
            return <span ref={containerRef} className={`inline-flex items-center justify-center shrink-0 ${className}`} style={{ width: size, height: size }}></span>;
        };

        const STORAGE_KEY = "rummy_scorer_prod_v196_deploy";
        const THEME_KEY = "rummy_scorer_theme_pref";
        const DEFAULT_ROSTER = ['Player 1', 'Player 2', 'Player 3'];

        // --- Summer Visual Components ---

        const SummerRain = () => {
            const icons = ['sun', 'ice-cream', 'glasses', 'umbrella', 'palmtree'];
            const items = useMemo(() => {
                return Array.from({ length: 20 }).map((_, i) => ({
                    id: i,
                    left: Math.random() * 100,
                    size: 18 + Math.random() * 12,
                    duration: 7 + Math.random() * 5,
                    delay: Math.random() * 10,
                    icon: icons[Math.floor(Math.random() * icons.length)]
                }));
            }, []);

            return (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-10 opacity-40">
                    {items.map(item => (
                        <div key={item.id} className="absolute animate-float" style={{ 
                            left: `${item.left}%`, 
                            animationDuration: `${item.duration}s`, 
                            animationDelay: `${item.delay}s`,
                            color: item.icon === 'sun' ? '#fbbf24' : '#ffffff'
                        }}>
                            <Icon name={item.icon} size={item.size} />
                        </div>
                    ))}
                </div>
            );
        };

        const SummerCenterpiece = () => (
            <div className="relative w-48 h-64 flex items-center justify-center">
                <div className="absolute w-72 h-72 bg-amber-400 rounded-full blur-[90px] animate-waves"></div>
                <div className="absolute w-56 h-56 bg-cyan-400 rounded-full blur-[50px] animate-waves delay-1000"></div>
                <div className="relative z-10 animate-sun flex flex-col items-center">
                    <div className="text-amber-500">
                        <svg width="140" height="140" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
                        </svg>
                    </div>
                    <div className="mt-[-85px] bg-slate-900 rounded-full px-4 py-1.5 flex items-center gap-1 shadow-2xl border border-white/20">
                        <div className="w-6 h-3 bg-slate-800 rounded-full"></div>
                        <div className="w-1.5 h-1.5 bg-slate-700 rounded-full"></div>
                        <div className="w-6 h-3 bg-slate-800 rounded-full"></div>
                    </div>
                </div>
            </div>
        );

        const CountdownTimer = ({ isDarkMode }) => {
            const [timeLeft, setTimeLeft] = useState({ d: 0, h: 0, m: 0, s: 0, finished: false });

            useEffect(() => {
                const targetDate = new Date("2026-06-01T00:00:00").getTime();
                const timer = setInterval(() => {
                    const now = new Date().getTime();
                    const diff = targetDate - now;
                    if (diff <= 0) {
                        setTimeLeft({ d: 0, h: 0, m: 0, s: 0, finished: true });
                        clearInterval(timer);
                    } else {
                        setTimeLeft({
                            d: Math.floor(diff / (1000 * 60 * 60 * 24)),
                            h: Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                            m: Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)),
                            s: Math.floor((diff % (1000 * 60)) / 1000),
                            finished: false
                        });
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="flex flex-col items-center mb-6 relative z-20">
                    <div className="text-[10px] font-black uppercase tracking-[0.5em] mb-3 opacity-70 summer-text">Vacation Countdown</div>
                    <div className="flex gap-4">
                        {[
                            { label: 'Days', value: timeLeft.d },
                            { label: 'Hrs', value: timeLeft.h },
                            { label: 'Min', value: timeLeft.m },
                            { label: 'Sec', value: timeLeft.s }
                        ].map((unit, i) => (
                            <div key={i} className="flex flex-col items-center">
                                <div className={`text-3xl font-black tabular-nums tracking-tighter ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                                    {String(unit.value).padStart(2, '0')}
                                </div>
                                <div className="text-[8px] font-bold uppercase tracking-widest opacity-40">{unit.label}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- Core Application ---

        const App = () => {
            const [showWelcome, setShowWelcome] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const saved = localStorage.getItem(THEME_KEY);
                return saved === null ? true : saved === 'true';
            });

            const [game, setGame] = useState(() => {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) return JSON.parse(data);
                return { players: DEFAULT_ROSTER, rounds: [], history: [], inactive: [], reEntries: new Array(DEFAULT_ROSTER.length).fill(0) };
            });

            const [ui, setUi] = useState({ add: false, editIdx: null, settings: false, history: false, bust: null, confirm: null });
            const [form, setForm] = useState({ scores: {}, name: '', editIdx: null, editVal: '', error: null });
            const scrollRef = useRef(null);

            const players = game.players;
            const rounds = game.rounds;
            const sessionHistory = game.history || [];
            const inactive = game.inactive || [];
            const reEntries = game.reEntries || new Array(players.length).fill(0);

            const totals = useMemo(() => players.map((_, pIdx) => rounds.reduce((sum, r) => sum + (Array.isArray(r) ? (r[pIdx] || 0) : 0), 0)), [players, rounds]);
            const activeTotals = useMemo(() => totals.filter((_, i) => !inactive.includes(i)), [totals, inactive]);
            const leaderIdx = useMemo(() => rounds.length === 0 ? -1 : totals.findIndex((t, i) => !inactive.includes(i) && t === Math.min(...activeTotals)), [totals, inactive, activeTotals, rounds]);
            const matchOver = (players.length - inactive.length) <= 1 && rounds.length > 0;

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(game));
                localStorage.setItem(THEME_KEY, isDarkMode.toString());
                if (!showWelcome) document.body.style.backgroundColor = isDarkMode ? "#1c1917" : "#f0f9ff";
            }, [game, isDarkMode, showWelcome]);

            useEffect(() => {
                if (!showWelcome && scrollRef.current && game.rounds.length > 0) {
                    scrollRef.current.scrollTo({ top: scrollRef.current.scrollHeight, behavior: 'smooth' });
                }
            }, [game.rounds, showWelcome]);

            // Locked logic functions
            const isPlayerLocked = (pIdx) => {
                if (!ui.bust) return false;
                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                );
                if (safeOpponents.length === 0) return false; 
                return !safeOpponents.some(t => t < 180);
            };

            const submitScores = (isEditing = false) => {
                setForm(f => ({ ...f, error: null }));
                const entry = players.map((p, i) => inactive.includes(i) ? 0 : parseInt(form.scores[p] || 0));
                
                if (entry.filter((s, i) => !inactive.includes(i) && s === 0).length !== 1) {
                    setForm(f => ({ ...f, error: "Exactly one winner (score 0) required." })); return;
                }

                if (isEditing) {
                    const up = [...rounds]; up[ui.editIdx] = entry;
                    setGame(g => ({ ...g, rounds: up }));
                    setUi(u => ({ ...u, editIdx: null })); setForm(f => ({ ...f, scores: {} }));
                } else {
                    const proj = totals.map((t, i) => t + (entry[i] || 0));
                    const bustedIdxs = proj.map((t, i) => (!inactive.includes(i) && t > 200) ? i : -1).filter(i => i !== -1);
                    
                    if (bustedIdxs.length > 0) {
                        const safePlayers = proj.filter((t, i) => !bustedIdxs.includes(i) && !inactive.includes(i));
                        const target = (safePlayers.length > 0 ? Math.max(...safePlayers) : 0) + 1;
                        setUi(u => ({ ...u, bust: { idxs: bustedIdxs, current: bustedIdxs[0], target, pending: entry, proj } }));
                    } else {
                        setGame(g => ({ ...g, rounds: [...g.rounds, entry] }));
                        setUi(u => ({ ...u, add: false })); setForm(f => ({ ...f, scores: {} }));
                    }
                }
            };

            const solveBust = (rejoin) => {
                const scores = [...ui.bust.pending];
                const pIdx = ui.bust.current;
                const locked = isPlayerLocked(pIdx);
                let upIn = [...inactive]; let upRe = [...reEntries];

                if (rejoin && !locked) {
                    scores[pIdx] = ui.bust.target - totals[pIdx];
                    upRe[pIdx] = (upRe[pIdx] || 0) + 1;
                } else {
                    if (!upIn.includes(pIdx)) upIn.push(pIdx);
                }

                const remaining = ui.bust.idxs.filter(i => i !== pIdx);
                if (remaining.length === 0) {
                    setGame(g => ({ ...g, inactive: upIn, reEntries: upRe, rounds: [...g.rounds, scores] }));
                    setUi(u => ({ ...u, bust: null, add: false })); setForm(f => ({ ...f, scores: {} }));
                } else {
                    setGame(g => ({ ...g, inactive: upIn, reEntries: upRe }));
                    setUi(u => ({ ...u, bust: { ...u.bust, current: remaining[0], idxs: remaining, pending: scores } }));
                }
            };

            const midGameJoin = () => {
                if(!form.name.trim()) return;
                const activeHigh = activeTotals.length > 0 ? Math.max(...activeTotals) : Math.max(...totals);
                setGame(g => ({
                    ...g, players: [...g.players, form.name.trim()], 
                    reEntries: [...(g.reEntries || new Array(g.players.length).fill(0)), 0],
                    rounds: g.rounds.map((r, i) => i === 0 ? [...r, activeHigh + 1] : [...r, 0])
                }));
                setForm(f => ({ ...f, name: '' }));
            };

            const savePlayerNameEdit = (idx) => {
                if (!form.editVal.trim()) return;
                const up = [...players]; up[idx] = form.editVal.trim();
                setGame(prev => ({ ...prev, players: up }));
                setForm(f => ({ ...f, editIdx: null, editVal: '' }));
            };

            const startNewMatch = () => {
                if (rounds.length === 0) return;
                setUi(u => ({ ...u, confirm: { msg: "Archive this session and head to the beach?", fn: () => {
                    const summary = { id: Date.now(), ts: Date.now(), players: [...players], rounds: [...rounds], inactive: [...inactive], reEntries: [...reEntries], finalScores: [...totals] };
                    setGame(prev => ({ ...prev, rounds: [], inactive: [], reEntries: new Array(prev.players.length).fill(0), history: [summary, ...(prev.history || [])].slice(0, 10) }));
                    setUi(prevUi => ({ ...prevUi, confirm: null }));
                }}}));
            };

            const restoreSession = (log) => {
                setUi({ ...ui, confirm: { msg: "Restore session? Current match will be lost.", fn: () => {
                    setGame(prev => ({ 
                        ...prev, 
                        players: log.players, 
                        rounds: log.rounds, 
                        inactive: log.inactive || [], 
                        reEntries: log.reEntries || new Array(log.players.length).fill(0) 
                    }));
                    setUi(u => ({ ...u, history: false, confirm: null }));
                }}});
            };

            if (showWelcome) {
                return (
                    <div className={`fixed inset-0 flex flex-col items-center justify-center p-8 transition-colors duration-500 overflow-hidden ${isDarkMode ? 'summer-bg-multicolor text-white' : 'light-summer-bg text-sky-950'}`}>
                        <SummerRain />
                        <div className="max-w-md w-full text-center relative z-10 flex flex-col items-center">
                            <CountdownTimer isDarkMode={isDarkMode} />
                            <SummerCenterpiece />
                            <div className={`text-6xl font-black italic tracking-tighter sun-glow drop-shadow-2xl mt-4 leading-none`}>2026</div>
                            <h1 className="text-3xl font-black uppercase italic mb-1 tracking-tighter text-amber-100 sun-glow">Rummy Scorer</h1>
                            <h2 className="text-5xl font-black uppercase tracking-widest leading-none text-white/20 mb-12">Holidays</h2>
                            <div className="flex gap-2 w-full max-w-xs">
                                <button onClick={() => setShowWelcome(false)} className={`flex-1 h-16 bg-cyan-600 hover:bg-cyan-500 text-white rounded-3xl font-black uppercase tracking-[0.2em] shadow-2xl active:scale-95 transition-all flex items-center justify-center gap-3 border border-cyan-400/30`}>Open Ledger</button>
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className={`w-16 h-16 rounded-3xl flex items-center justify-center shadow-2xl active:scale-95 transition-all bg-sky-900/50 text-cyan-400 border border-cyan-500/20`}><Icon name={isDarkMode ? "sun" : "moon"} /></button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`fixed inset-0 flex flex-col transition-colors duration-500 overflow-hidden ${isDarkMode ? 'bg-[#1c1917] text-slate-100' : 'bg-[#f0f9ff] text-slate-900'}`}>
                    <SummerRain />
                    <nav className={`flex-none px-4 py-4 z-40 pt-safe border-b backdrop-blur-xl ${isDarkMode ? 'bg-sky-950/70 border-white/5' : 'bg-white/90 border-sky-100 shadow-sm'}`}>
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-2 group">
                                <button onClick={() => setShowWelcome(true)} className="w-10 h-10 rounded-2xl flex items-center justify-center text-white shadow-lg bg-cyan-600 active:scale-90 transition-all"><Icon name="sun" /></button>
                                <div className="text-left leading-none"><h1 className="text-[11px] font-black uppercase tracking-tight text-cyan-500">Rummy Scorer</h1><span className="text-[9px] font-bold uppercase opacity-80 italic">Summer '26</span></div>
                            </div>
                            <div className="flex items-center gap-1">
                                <button onClick={startNewMatch} className="p-2 opacity-70 hover:opacity-100 text-amber-500 active:scale-90 transition-all"><Icon name="rotate-ccw" /></button>
                                <button onClick={() => setUi({...ui, history: true})} className="p-2 opacity-70 active:scale-90 transition-all"><Icon name="history" /></button>
                                <button onClick={() => setUi({...ui, settings: true})} className="p-2 opacity-70 active:scale-90 transition-all"><Icon name="settings-2" /></button>
                            </div>
                        </div>
                    </nav>

                    <div className="flex-1 flex flex-col overflow-hidden relative">
                        <div className={`flex-none flex border-b-2 z-20 ${isDarkMode ? 'bg-sky-950/40 border-white/5 shadow-lg' : 'bg-white shadow-sm'}`}>
                            <div className="w-10 flex items-center justify-center text-[8px] font-black text-slate-500 italic uppercase leading-none">Deal</div>
                            <div className="flex-1 flex">
                                {players.map((p, i) => (
                                    <div key={i} className={`flex-1 border-r last:border-r-0 py-3 text-center truncate transition-all duration-500 ${inactive.includes(i) ? 'player-inactive bg-black/10' : ''}`}>
                                        <div className="flex flex-col items-center justify-center px-0.5 min-w-0">
                                            <span className={`text-[10px] font-black uppercase truncate block w-full tracking-tight ${isDarkMode ? 'text-cyan-400' : 'text-sky-800'}`}>{p}</span>
                                            {reEntries[i] > 0 && <span className="bg-amber-500 text-black text-[6px] px-1 rounded-sm leading-none py-1 font-black">R{reEntries[i]}</span>}
                                            {inactive.includes(i) && <span className="text-[6px] text-rose-500 font-bold uppercase mt-1 italic leading-none">OUT</span>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div ref={scrollRef} className="flex-1 overflow-y-auto no-scrollbar bg-black/5">
                            {rounds.map((round, rIdx) => (
                                <div key={rIdx} className={`flex border-b transition-colors ${isDarkMode ? 'border-white/5 hover:bg-white/5' : 'border-sky-50 hover:bg-white'}`}>
                                    <div className="w-10 flex flex-col items-center justify-center py-4"><span className="text-[10px] font-bold text-slate-500 italic">{rIdx + 1}</span><button onClick={() => { setUi({...ui, editIdx: rIdx}); const c = {}; players.forEach((p, i) => c[p] = round[i]); setForm({...form, scores: c}); }} className="text-cyan-500/40 mt-1 active:scale-90 transition-all"><Icon name="pencil-line" size={12} /></button></div>
                                    <div className="flex-1 flex">
                                        {round.map((score, cIdx) => (
                                            <div key={cIdx} className={`flex-1 border-r last:border-r-0 flex items-center justify-center py-4 transition-all duration-500 ${inactive.includes(cIdx) ? 'opacity-20 grayscale' : ''}`}>
                                                {score === 0 ? <span className="w-7 h-7 rounded-full bg-cyan-600 text-white flex items-center justify-center text-[10px] font-black shadow-md border border-white/20">0</span> : <span className="text-sm font-bold tabular-nums">{score}</span>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className={`flex-none flex text-white shadow-[0_-10px_30px_rgba(0,0,0,0.3)] z-30 transition-colors ${isDarkMode ? 'bg-sky-900 border-t border-white/5' : 'bg-sky-600 shadow-xl'}`}>
                            <div className="w-10 flex items-center justify-center text-[8px] font-black italic bg-black/20 text-sky-200 uppercase leading-tight">Total</div>
                            <div className="flex-1 flex">
                                {totals.map((total, i) => (
                                    <div key={i} className={`flex-1 py-4 border-r last:border-r-0 border-white/5 text-center font-black text-lg min-w-0 transition-all duration-500 ${inactive.includes(i) ? 'total-inactive grayscale' : ''}`}>
                                        <span className="flex items-center justify-center gap-1">{total} {i === leaderIdx && !inactive.includes(i) && rounds.length > 0 && <Icon name="sun" size={14} className="text-yellow-400 animate-bounce" />}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className={`p-5 pb-safe flex-none border-t z-20 ${isDarkMode ? 'bg-sky-950/90 border-white/5' : 'bg-white border-sky-100 shadow-xl'}`}>
                        {matchOver ? (
                            <div className="text-center p-2 animate-in zoom-in-95 duration-500"><h4 className="text-xl font-black italic text-cyan-600 uppercase mb-3 text-center">Vacation Won!</h4><button onClick={startNewMatch} className="px-10 py-4 bg-cyan-600 text-white rounded-full text-xs font-black uppercase active:scale-95 transition-all shadow-xl">New Session</button></div>
                        ) : (
                            <div className="flex gap-2 max-w-lg mx-auto">
                                <button onClick={() => setUi({...ui, add: true})} className="flex-1 h-16 bg-cyan-600 hover:bg-cyan-500 text-white rounded-3xl font-black uppercase tracking-widest shadow-xl flex items-center justify-center gap-3 active:scale-95 transition-all"><Icon name="plus" size={24} /> Record Hand</button>
                                <button onClick={() => {
                                    const text = `🏖️ Rummy Scorer Summer Standings 🏖️\n\n` + players.map((p, i) => `${p}: ${totals[i]}${reEntries[i] > 0 ? ` (R${reEntries[i]})` : ''}${inactive.includes(i) ? ' (Out)' : ''}`).join('\n');
                                    if(navigator.share) navigator.share({text}); else { const el = document.createElement('textarea'); el.value = text; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); setUi(u=>({...u, confirm: {msg: "Scores copied to clipboard!", fn: () => setUi(us=>({...us, confirm: null})) } })); }
                                }} className={`px-6 h-16 rounded-2xl font-black shadow-xl flex items-center justify-center transition-all active:scale-95 ${isDarkMode ? 'bg-sky-900 text-cyan-400' : 'bg-sky-50 text-sky-800'}`}>
                                    <Icon name="share-2" size={24} />
                                </button>
                            </div>
                        )}
                    </div>

                    {/* MODAL SYSTEM */}
                    {(ui.add || ui.editIdx !== null || ui.settings || ui.history || ui.bust || ui.confirm) && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm animate-in fade-in">
                            
                            {(ui.add || ui.editIdx !== null) && (
                                <div className={`w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl border animate-in slide-in-from-bottom-10 ${isDarkMode ? 'bg-sky-950 border-white/5 text-white' : 'bg-white border-sky-100 text-slate-900'}`}>
                                    <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-black text-cyan-600 uppercase italic">{ui.editIdx !== null ? "Edit Scores" : "New Hand"}</h3><button onClick={() => setUi({...ui, add: false, editIdx: null})} className="text-slate-500 p-2"><Icon name="x" size={28} /></button></div>
                                    {form.error && <div className="mb-4 bg-rose-500/10 p-3 rounded-xl text-[10px] font-black text-rose-500 uppercase animate-bounce">{form.error}</div>}
                                    <div className="grid grid-cols-2 gap-4 mb-8 max-h-[40vh] overflow-y-auto pr-1 no-scrollbar">{players.map((p, idx) => !inactive.includes(idx) && (<div key={idx} className="flex flex-col gap-2"><label className="text-[10px] font-black uppercase text-cyan-500 truncate">{p}</label><input type="number" inputMode="numeric" value={form.scores[p] || ''} onChange={e => setForm({...form, scores: {...form.scores, [p]: e.target.value}})} className={`w-full p-5 rounded-2xl text-center text-3xl font-black outline-none border transition-all ${isDarkMode ? 'bg-sky-900/40 border-white/5 text-cyan-300' : 'bg-slate-50 border-sky-100 text-sky-950'}`} placeholder="0" /></div>))}</div>
                                    <button onClick={() => submitScores(ui.editIdx !== null)} className="w-full bg-cyan-600 hover:bg-cyan-500 py-6 rounded-3xl font-black uppercase shadow-xl text-white tracking-widest active:scale-95 transition-all">Confirm Hand</button>
                                </div>
                            )}

                            {ui.settings && (
                                <div className={`w-full max-sm rounded-[2.5rem] p-8 shadow-2xl border ${isDarkMode ? 'bg-sky-950 border-white/5 text-white' : 'bg-white border-sky-100 text-slate-900'}`}>
                                    <h3 className="text-xl font-black text-cyan-600 uppercase mb-8 flex items-center gap-3 tracking-tighter"><Icon name="users" /> Registry</h3>
                                    <input type="text" value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Player Name" className={`w-full p-5 rounded-2xl mb-4 font-bold outline-none border ${isDarkMode ? 'bg-sky-900/40 border-white/5 text-cyan-300' : 'bg-slate-50 border-sky-100'}`} />
                                    <div className="grid grid-cols-2 gap-2 mb-8">
                                        <button onClick={() => { if(form.name) { setGame(g=>({...g, players: [...g.players, form.name.trim()], rounds: [], inactive: [], reEntries: new Array(g.players.length+1).fill(0)})); setForm(f=>({...f, name:''})); setUi(u=>({...u, settings: false})); }}} className={`py-4 rounded-2xl text-[10px] font-black uppercase border active:scale-95 transition-all border-white/10 bg-sky-900/50 text-cyan-100`}>Reset Beach</button>
                                        <button onClick={midGameJoin} className="py-4 bg-cyan-600 text-white rounded-2xl text-[10px] font-black uppercase shadow-lg active:scale-95 transition-all">Join @ Max+1</button>
                                    </div>
                                    <div className="space-y-2 mb-8 max-h-48 overflow-y-auto no-scrollbar">
                                        {players.map((p, i) => (
                                            <div key={i} className={`flex items-center justify-between p-4 rounded-2xl border transition-all duration-500 ${isDarkMode ? 'bg-sky-900/20 border-white/5' : 'bg-slate-50 border-sky-100 shadow-sm'} ${inactive.includes(i) ? 'opacity-30 grayscale' : ''}`}>
                                                {form.editIdx === i ? (
                                                    <div className="flex-1 flex gap-2 min-w-0">
                                                        <input type="text" value={form.editVal} onChange={e => setForm({...form, editVal: e.target.value})} className="flex-1 bg-black/40 px-3 py-1 rounded text-[10px] font-black uppercase outline-none text-cyan-400 min-w-0" autoFocus />
                                                        <button onClick={() => savePlayerNameEdit(i)} className="text-emerald-500 shrink-0"><Icon name="check-circle-2" /></button>
                                                    </div>
                                                ) : (
                                                    <>
                                                        <span className="text-[10px] font-black uppercase truncate max-w-[120px]">{p} {inactive.includes(i) && <span className="ml-1 text-[8px]">(OUT)</span>}</span>
                                                        <div className="flex gap-1 shrink-0">
                                                            <button onClick={() => setForm({...form, editIdx: i, editVal: p})} className="p-2 opacity-50 text-cyan-500"><Icon name="pencil" size={16}/></button>
                                                            {players.length > 2 && <button onClick={() => setUi({ ...ui, confirm: { msg: `Remove player ${p}? Tournament will reset.`, fn: () => { setGame({...game, players: players.filter((_, idx) => idx !== i), rounds: [], inactive: []}); setUi({...ui, confirm: null}); } } })} className="text-rose-500 p-2"><Icon name="user-minus" size={18}/></button>}
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => setUi({...ui, settings: false})} className="w-full py-5 bg-sky-950 text-white rounded-2xl font-black uppercase text-xs active:scale-95 transition-all border border-white/5 text-center">Close Registry</button>
                                </div>
                            )}

                            {ui.history && (
                                <div className={`w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl border ${isDarkMode ? 'bg-sky-950 border-white/5 text-white' : 'bg-white border-sky-100 text-slate-900'}`}>
                                    <h3 className="text-xl font-black text-cyan-600 uppercase mb-6 flex items-center gap-3 tracking-tighter"><Icon name="history" /> History Log</h3>
                                    <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-1 no-scrollbar">
                                        {sessionHistory.length === 0 ? <div className="py-20 text-center opacity-20 text-xs font-black uppercase italic tracking-widest text-center text-cyan-500">Empty Logs</div> : sessionHistory.map((log) => (
                                            <div key={log.id} className={`p-4 rounded-2xl border ${isDarkMode ? 'bg-sky-900/20 border-white/5 shadow-inner' : 'bg-slate-50 border-sky-100 shadow-sm'}`}>
                                                <div className="flex justify-between mb-3 border-b border-sky-500/10 pb-2 text-cyan-500 font-black tracking-widest">
                                                    <span className="text-[10px]">{new Date(log.id).toLocaleDateString()}</span>
                                                    <button onClick={() => restoreSession(log)} className="text-[8px] bg-amber-600 text-white px-2 py-1 rounded font-black uppercase active:scale-90 transition-all">Restore</button>
                                                </div>
                                                <div className="grid grid-cols-2 gap-2">
                                                    {log.players.map((pName, pIdx) => (
                                                        <div key={pIdx} className="flex items-center justify-between text-[10px] opacity-80 truncate">
                                                            <span className="truncate">{pName}</span>
                                                            <span className="font-bold">{log.finalScores[pIdx]}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => setUi({...ui, history: false})} className="w-full mt-8 py-5 bg-sky-950 text-white rounded-2xl font-black uppercase text-xs active:scale-95 transition-all border border-white/5 text-center">Close Logs</button>
                                </div>
                            )}

                            {ui.confirm && (
                                <div className="w-full max-w-xs rounded-[2.5rem] p-8 bg-sky-950 border border-white/10 text-center shadow-2xl animate-in zoom-in-95">
                                    <Icon name="alert-triangle" size={32} className="text-amber-500 mb-4 mx-auto" />
                                    <p className="text-sm font-black uppercase text-sky-100 mb-8 leading-tight tracking-tight text-center">{ui.confirm.msg}</p>
                                    <div className="flex gap-2">
                                        <button onClick={ui.confirm.fn} className="flex-1 py-4 bg-cyan-600 text-white rounded-xl text-[10px] font-black uppercase transition-all active:scale-95">Yes</button>
                                        <button onClick={() => setUi({...ui, confirm: null})} className="flex-1 py-4 bg-sky-900 text-cyan-200 rounded-xl text-[10px] font-black uppercase transition-all active:scale-95">No</button>
                                    </div>
                                </div>
                            )}

                            {ui.bust && (
                                <div className={`w-full max-sm rounded-[2.5rem] p-8 shadow-2xl border animate-in zoom-in-95 ${isDarkMode ? 'bg-sky-950 text-white border-white/5' : 'bg-white border-sky-100 text-slate-900'}`}>
                                    <div className="text-center mb-8">
                                        <div className="w-16 h-16 bg-amber-500/10 rounded-full flex items-center justify-center mx-auto mb-4 text-amber-500">
                                            {(() => {
                                                const pIdx = ui.bust.current;
                                                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                                                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                                                );
                                                const locked = safeOpponents.length > 0 && !safeOpponents.some(t => t < 180);
                                                return <Icon name={locked ? "lock" : "sun"} size={32}/>
                                            })()}
                                        </div>
                                        <h3 className="text-2xl font-black uppercase italic mb-4 tracking-tighter leading-none">Wipeout! (Bust)</h3>
                                        <p className="text-xs font-bold uppercase opacity-60 px-4 leading-relaxed tracking-tighter text-center">
                                            {players[ui.bust.current]} passed 200. <br/>
                                            {(() => {
                                                const pIdx = ui.bust.current;
                                                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                                                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                                                );
                                                const locked = safeOpponents.length > 0 && !safeOpponents.some(t => t < 180);
                                                return locked 
                                                    ? "The Door is Closed. Safe player at 180+ prohibits re-entry." 
                                                    : `Re-buy for ${ui.bust.target} points?`;
                                            })()}
                                        </p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <button 
                                            onClick={() => solveBust(true)} 
                                            disabled={(() => {
                                                const pIdx = ui.bust.current;
                                                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                                                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                                                );
                                                return safeOpponents.length > 0 && !safeOpponents.some(t => t < 180);
                                            })()} 
                                            className={`py-5 rounded-2xl text-xs font-black uppercase shadow-xl transition-all ${(() => {
                                                const pIdx = ui.bust.current;
                                                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                                                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                                                );
                                                const locked = safeOpponents.length > 0 && !safeOpponents.some(t => t < 180);
                                                return locked ? 'bg-slate-800 text-slate-600 opacity-20 shadow-none cursor-not-allowed' : 'bg-cyan-600 text-white btn-active shadow-lg';
                                            })()}`}
                                        >
                                            Re-entry
                                        </button>
                                        <button onClick={() => solveBust(false)} className="bg-rose-700 text-white py-5 rounded-2xl text-xs font-black uppercase btn-active shadow-xl tracking-widest active:scale-95 transition-all">Stay Out</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
